<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toju — Synapse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="motion.css" />
  <style>
    /* ── TRUE GLASSMORPHISM, WARM & LIGHT ──
       Frosted glass over a bright warm interior: translucent white gradient
       fills, heavy backdrop blur, a thin luminous rim, a soft top highlight.
       Off-white with a breath of terracotta — never dark. */
    .tj-orb { position: absolute; width: 56px; height: 56px; margin: -16px 0 0 -6px; opacity: .6; pointer-events: none; }
    body { background: #f7efe7; }
    .tj-bg { position: fixed; inset: 0; z-index: 0;
      background: url('https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat; }
    /* whisper of a warm wash — the photo stays CLEAR; glass does the frosting */
    .tj-wash { position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(120% 80% at 78% 0%, rgba(212,110,60,0.14), transparent 58%),
        linear-gradient(180deg, rgba(250,242,234,0.18) 0%, rgba(248,238,228,0.22) 55%, rgba(244,230,216,0.38) 100%); }

    /* glass recipe, shared — light frost with a luminous rim */
    .toju .bubble, .chatbox, .pcard, .tj-hint {
      background: linear-gradient(135deg, rgba(255,255,255,0.66), rgba(255,251,246,0.38));
      backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 18px 44px rgba(122,62,22,0.13), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .appbar { background: rgba(250,245,239,0.6); backdrop-filter: blur(24px) saturate(1.5); border-bottom: 1px solid rgba(255,255,255,0.6); }

    .wrap { position: relative; z-index: 1; }
    .tj-head { padding-top: 8px; }
    .tj-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #C2552B; }
    .tj-title { font-family: var(--f-serif); font-weight: 300; font-size: 40px; letter-spacing: -0.02em; color: var(--ink); display: flex; align-items: center; gap: 10px; margin-top: 2px; }
    .tj-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px rgba(46,125,79,0.14); }

    .convo { display: flex; flex-direction: column; gap: 18px; padding-top: 22px; }
    .msg { display: flex; align-items: flex-end; gap: 9px; }
    .msg.user { flex-direction: row-reverse; }
    .col { max-width: 84%; display: flex; flex-direction: column; }
    .av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .av-toju { background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 6px 16px rgba(150,70,20,0.25); }
    .av-user { background: rgba(255,255,255,0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.8); color: var(--ink-muted); font-size: 13px; font-weight: 600; }
    .sender { font-size: 11.5px; font-weight: 600; color: #C2552B; margin: 0 0 5px 3px; }

    .bubble { padding: 13px 16px; border-radius: 20px; font-size: 14.5px; line-height: 1.55; }
    .toju .bubble { color: var(--ink); border-bottom-left-radius: 6px; }
    .user .bubble { background: linear-gradient(135deg, rgba(255,123,44,0.82), rgba(235,100,30,0.62));
      backdrop-filter: blur(22px) saturate(1.7); -webkit-backdrop-filter: blur(22px) saturate(1.7); color: #fff;
      border: 1px solid rgba(255,255,255,0.5); border-bottom-right-radius: 6px;
      box-shadow: 0 14px 32px rgba(200,95,30,0.28), inset 0 1px 0 rgba(255,255,255,0.4); }

    .matches-h { display: flex; align-items: center; gap: 7px; margin: 12px 0 8px; }
    .matches-h .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #C2552B; }
    .matches-h .cnt { font-size: 11px; font-weight: 700; color: #C2552B; background: rgba(194,85,43,0.1); border: 1px solid rgba(194,85,43,0.2); border-radius: 9px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .matches-h .viewall { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #C2552B; text-decoration: none; }
    .matches-h .viewall:hover { text-decoration: underline; }
    .pcard { display: flex; gap: 13px; margin-top: 9px; padding: 11px; border-radius: 15px; cursor: pointer; transition: all .2s; color: var(--ink); }
    .pcard, .pcard * { text-decoration: none; }
    .pcard:hover { transform: translateY(-1px); border-color: rgba(255,123,44,0.45); }
    .pcard img { width: 62px; height: 62px; border-radius: 12px; object-fit: cover; }
    .pcard .pthumb { width: 62px; height: 62px; border-radius: 12px; flex: none; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; font-family: var(--f-serif);
      background: linear-gradient(135deg, #C2552B, #FF7B2C); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); }
    .pcard .pthumb b { font-size: 20px; line-height: 1; }
    .pcard .pthumb span { font-size: 9px; letter-spacing: .08em; opacity: .9; margin-top: 3px; }
    .pcard .price { font-family: var(--f-serif); font-size: 21px; color: var(--brand); }
    .pcard .ttl { font-size: 13px; font-weight: 500; color: var(--ink); }
    .pcard .meta { font-size: 11.5px; color: var(--ink-muted); }
    .pcard .watch { font-size: 11px; color: var(--ink-muted); margin-top: 3px; }
    .pcard .watch b { color: #b0521f; font-weight: 600; }
    .pcard .trust { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--brand); }

    .typing .bubble { display: flex; align-items: center; gap: 9px; }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: inline-block; animation: tjpulse 1.1s infinite; }
    .typing-dots i:nth-child(2) { animation-delay: .18s; } .typing-dots i:nth-child(3) { animation-delay: .36s; }
    @keyframes tjpulse { 0%,60%,100%{opacity:.25} 30%{opacity:1} }

    /* composer — one frosted chatbox: input on top, suggestions tucked at the bottom */
    .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 14px 22px 34px;
      display: flex; flex-direction: column; align-items: center; gap: 9px; background: none; }
    .tj-hint { width: 100%; max-width: 480px; text-align: center; font-size: 12.5px; color: var(--ink-muted); border-radius: 12px; padding: 8px 14px; }
    .chatbox { width: 100%; max-width: 480px; border-radius: 24px; padding: 6px 6px 8px;
      backdrop-filter: blur(36px) saturate(1.6); -webkit-backdrop-filter: blur(36px) saturate(1.6); }
    .pillrow { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 15px; }
    .pillrow input { flex: 1; border: none; outline: none; font-family: var(--f-sans); font-size: 14.5px; background: transparent; color: var(--ink); }
    .pillrow input::placeholder { color: rgba(21,23,26,0.45); }
    .mic, .send { width: 38px; height: 38px; border-radius: 13px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
    .mic { background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.85); color: var(--ink-muted); }
    .mic.listening { background: var(--brand); color: #fff; animation: micpulse 1.3s infinite; }
    @keyframes micpulse { 0%{ box-shadow: 0 0 0 0 rgba(255,123,44,0.5);} 70%{ box-shadow: 0 0 0 10px rgba(255,123,44,0);} 100%{ box-shadow: 0 0 0 0 rgba(255,123,44,0);} }
    .send { background: var(--brand); color: #fff; font-size: 17px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); }
    .send:disabled { opacity: .45; }
    .chatbox .suggest { display: flex; gap: 7px; padding: 9px 5px 2px; margin-top: 4px; overflow-x: auto; border-top: 1px solid rgba(255,255,255,0.6); }
    .chatbox .suggest::-webkit-scrollbar { display: none; }
    .chatbox .suggest button { white-space: nowrap; font-family: var(--f-sans); font-size: 12px; font-weight: 500; color: rgba(21,23,26,0.7); cursor: pointer;
      background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); border-radius: 100px; padding: 6px 12px; transition: all .18s; }
    .chatbox .suggest button:hover { color: var(--ink); border-color: rgba(255,123,44,0.45); background: rgba(255,255,255,0.7); }
    /* Toju silently reads the Dream Home board — this chip makes it visible */
    .chatbox .dreamctx { display: flex; align-items: center; gap: 7px; font-family: var(--f-sans); font-size: 11.5px; color: #a8571f;
      background: rgba(255,123,44,0.08); border: 1px solid rgba(255,123,44,0.22); border-radius: 100px; padding: 6px 12px; margin-bottom: 8px; }
    .chatbox .dreamctx b { font-weight: 600; color: #8a4517; }
    .chatbox .dreamctx a { margin-left: auto; color: #C2552B; font-weight: 600; white-space: nowrap; text-decoration: none; }
    .chatbox .dreamctx a:hover { text-decoration: underline; }
    .convo-wrap { padding-bottom: 180px; }

    /* ── TWO-PANE CANVAS LAYOUT (chat left · listings right) ── */
    html, body { height: 100%; }
    body { overflow: hidden; }
    .tj-app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100dvh; }
    .tj-app .appbar { flex: none; }
    .tj-layout { flex: 1; display: flex; min-height: 0; }
    /* Gemini-canvas ratio — chat 25% : canvas 75% */
    .tj-chat { display: flex; flex-direction: column; min-height: 0; width: 25%; min-width: 280px; border-right: 1px solid rgba(255,255,255,0.55); }
    .tj-chat .tj-head { flex: none; padding: 16px 22px 4px; }
    .convo-scroll { flex: 1; overflow-y: auto; padding: 8px 22px 12px; }
    .convo-scroll::-webkit-scrollbar { width: 7px; } .convo-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }
    .convo-scroll .convo { padding-top: 8px; }
    .tj-chat .composer { position: static; flex: none; padding: 10px 16px 16px; }
    .tj-chat .chatbox, .tj-chat .tj-hint { max-width: none; }

    /* right listings canvas */
    .tj-canvas { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .cv-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.5); }
    .cv-head .cv-t { font-family: var(--f-serif); font-weight: 300; font-size: 23px; color: var(--ink); }
    .cv-head .cv-c { font-size: 12px; font-weight: 700; color: #C2552B; background: rgba(194,85,43,0.1); border: 1px solid rgba(194,85,43,0.2); border-radius: 100px; padding: 2px 10px; }
    .cv-head .cv-all { margin-left: auto; font-size: 12.5px; font-weight: 600; color: #C2552B; text-decoration: none; }
    .cv-head .cv-all:hover { text-decoration: underline; }
    .cv-body { flex: 1; overflow-y: auto; padding: 22px 24px 40px; }
    .cv-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--ink-muted); gap: 10px; padding: 40px; }
    .cv-empty .em-orb { width: 66px; height: 66px; opacity: .8; }
    .cv-empty p { font-size: 14.5px; max-width: 330px; line-height: 1.65; }
    .cv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px,1fr)); gap: 16px; }
    .cv-card { border-radius: 18px; overflow: hidden; cursor: pointer; text-decoration: none; color: var(--ink); display: flex; flex-direction: column;
      background: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(255,251,246,0.46));
      backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 14px 36px rgba(122,62,22,0.12); transition: transform .2s, border-color .2s; }
    .cv-card:hover { transform: translateY(-3px); border-color: rgba(255,123,44,0.5); }
    .cv-banner { height: 122px; position: relative; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(135deg, #C2552B, #FF7B2C); }
    .cv-banner .cv-bed { text-align: center; }
    .cv-banner .cv-bed b { font-family: var(--f-serif); font-size: 38px; line-height: 1; }
    .cv-banner .cv-bed span { font-size: 9.5px; letter-spacing: .1em; opacity: .9; }
    .cv-trustchip { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700; color: #fff; background: rgba(20,14,8,0.34); border: 1px solid rgba(255,255,255,0.4); border-radius: 100px; padding: 3px 9px; backdrop-filter: blur(6px); }
    .cv-dealchip { position: absolute; top: 10px; left: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: rgba(20,14,8,0.3); border: 1px solid rgba(255,255,255,0.35); border-radius: 100px; padding: 3px 9px; backdrop-filter: blur(6px); }
    .cv-cbody { padding: 13px 15px 15px; }
    .cv-price { font-family: var(--f-serif); font-size: 22px; color: var(--brand); }
    .cv-price small { font-size: 12px; color: var(--ink-muted); font-family: var(--f-sans); }
    .cv-ttl { font-size: 13.5px; font-weight: 500; margin-top: 2px; }
    .cv-meta { font-size: 11.5px; color: var(--ink-muted); margin-top: 3px; }
    .cv-why { font-size: 11.5px; color: #b0521f; margin-top: 8px; line-height: 1.5; }
    .cv-why b { color: var(--ink); }

    /* ── canvas toolbar: Filters · Sort · View · Compare · Expand ── */
    .cv-tools { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 24px; border-bottom: 1px solid rgba(255,255,255,0.5); }
    .cv-search { flex: 1 1 150px; min-width: 130px; display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.85); border-radius: 100px; padding: 7px 13px; }
    .cv-search input { flex: 1; min-width: 0; border: none; background: none; outline: none; font: 12.5px var(--f-sans); color: var(--ink); }
    .cv-deal { display: flex; gap: 5px; }
    .cv-deal button { font: 600 11.5px var(--f-sans); color: var(--ink-muted); background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.85); border-radius: 100px; padding: 7px 12px; cursor: pointer; transition: all .15s; }
    .cv-deal button.on { color: #C2552B; background: rgba(194,85,43,0.1); border-color: rgba(194,85,43,0.3); }
    .cv-tools select { font: 500 11.5px var(--f-sans); color: var(--ink); background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.85); border-radius: 100px; padding: 7px 10px; outline: none; cursor: pointer; }
    .cv-view { display: flex; border: 1px solid rgba(255,255,255,0.85); border-radius: 100px; overflow: hidden; }
    .cv-view button { font: 600 11.5px var(--f-sans); color: var(--ink-muted); background: rgba(255,255,255,0.55); border: none; padding: 7px 11px; cursor: pointer; }
    .cv-view button.on { color: #fff; background: #C2552B; }
    .cv-cmp-toggle { font: 600 11.5px var(--f-sans); color: var(--ink-muted); background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.85); border-radius: 100px; padding: 7px 12px; cursor: pointer; }
    .cv-cmp-toggle.on { color: #C2552B; background: rgba(194,85,43,0.1); border-color: rgba(194,85,43,0.3); }

    /* compare ticks on cards */
    .cv-tick { position: absolute; bottom: 10px; right: 10px; z-index: 2; width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.9); background: rgba(20,14,8,0.3); backdrop-filter: blur(6px); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .cv-tick.on { background: #C2552B; border-color: #C2552B; }

    /* list view rows */
    .cv-rows { display: flex; flex-direction: column; gap: 10px; }
    .cv-row { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px; text-decoration: none; color: var(--ink);
      background: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(255,251,246,0.46));
      backdrop-filter: blur(20px) saturate(1.5); border: 1px solid rgba(255,255,255,0.8); transition: transform .15s, border-color .15s; }
    .cv-row:hover { transform: translateY(-2px); border-color: rgba(255,123,44,0.5); }
    .cv-row .rbed { flex: none; width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg,#C2552B,#FF7B2C); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
    .cv-row .rbed b { font-family: var(--f-serif); font-size: 19px; }
    .cv-row .rbed span { font-size: 7.5px; letter-spacing: .08em; }
    .cv-row .rmain { flex: 1; min-width: 0; }
    .cv-row .rttl { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cv-row .rmeta { font-size: 11.5px; color: var(--ink-muted); margin-top: 1px; }
    .cv-row .rwhy { font-size: 11px; color: #b0521f; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cv-row .rprice { flex: none; text-align: right; font-family: var(--f-serif); font-size: 18px; color: var(--brand); }
    .cv-row .rprice small { font-size: 11px; color: var(--ink-muted); font-family: var(--f-sans); }
    .cv-row .rtrust { flex: none; font-size: 11px; font-weight: 700; color: #C2552B; background: rgba(194,85,43,0.1); border: 1px solid rgba(194,85,43,0.22); border-radius: 100px; padding: 3px 9px; }
    .cv-row .cv-tick { position: static; background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.12); color: var(--ink-muted); }
    .cv-row .cv-tick.on { background: #C2552B; border-color: #C2552B; color: #fff; }

    /* compare bar + verdict sheet (inside the canvas) */
    .cv-cmpbar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(90px); transition: transform .25s cubic-bezier(.22,1,.36,1); z-index: 5;
      display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 18px; border-radius: 100px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 18px 44px rgba(122,62,22,0.22); font-size: 13px; }
    .cv-cmpbar.on { transform: translateX(-50%) translateY(0); }
    .cv-cmpbar button { background: var(--brand); color: #fff; font: 600 12.5px var(--f-sans); border: none; border-radius: 100px; padding: 9px 16px; cursor: pointer; }
    .cv-sheetwrap { position: absolute; inset: 0; z-index: 6; display: none; align-items: flex-end; background: rgba(20,14,8,0.25); backdrop-filter: blur(3px); }
    .cv-sheetwrap.on { display: flex; }
    .cv-sheet { width: 100%; max-height: 86%; overflow-y: auto; background: rgba(252,248,243,0.97); border-top: 1px solid rgba(255,255,255,0.9); border-radius: 22px 22px 0 0; padding: 22px 26px 30px; }
    .cv-sheet .sh-t { font-family: var(--f-serif); font-weight: 300; font-size: 20px; }
    .cv-sheet .verdict { margin-top: 12px; font-size: 13.5px; line-height: 1.7; background: rgba(255,123,44,0.07); border: 1px solid rgba(255,123,44,0.22); border-radius: 14px; padding: 14px 16px; }
    .cv-sheet .verdict b { color: var(--brand); }
    .cv-sheet table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12.5px; }
    .cv-sheet th, .cv-sheet td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(0,0,0,0.06); }
    .cv-sheet th { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
    .cv-sheet .win { color: var(--brand); font-weight: 700; }
    .cv-sheet .sh-x { float: right; border: none; background: none; font-size: 20px; color: var(--ink-dim); cursor: pointer; }

    /* desktop shows the canvas (hide inline chat cards); mobile keeps inline cards, hides canvas */
    @media (min-width: 900px) { .tj-chat .matches-h, .tj-chat .pcard { display: none; } }
    @media (max-width: 899px) {
      body { overflow: auto; }
      .tj-app { height: auto; min-height: 100dvh; }
      .tj-layout { flex-direction: column; }
      .tj-chat { width: 100%; max-width: none; min-width: 0; border-right: none; }
      .convo-scroll { overflow: visible; }
      .tj-chat .composer { position: sticky; bottom: 0; }
      .tj-canvas { display: none; }
    }
  </style>
</head>
<body>
  <div class="tj-bg"></div>
  <div class="tj-wash"></div>

  <div class="tj-app">
    <div class="appbar">
      <a class="brand" href="../index.html">
        <svg viewBox="0 0 64 78" fill="#15171a"><rect x="0" y="0" width="10" height="78" rx="1"/><rect x="10" y="0" width="44" height="10" rx="1"/><rect x="44" y="10" width="10" height="17" rx="1"/><rect x="10" y="17" width="44" height="10" rx="1"/><rect x="10" y="36" width="44" height="10" rx="1"/><rect x="46" y="46" width="8" height="22" rx="1"/><rect x="18" y="46" width="8" height="22" rx="1"/><rect x="10" y="68" width="44" height="10" rx="1"/></svg>
        Synapse

        <a href="toju.html" class="active">Toju</a>

      <a class="home" href="../index.html">← Back to site</a>
    </div>

    <div class="tj-layout">
      <!-- LEFT: the chat (smaller window) -->
      <section class="tj-chat">
        <div class="tj-head">
          <div class="tj-eyebrow">AI Property Consultant</div>
          <div class="tj-title">Toju <span style="position:relative"><span class="tj-orb" data-lottie="orb-pulse" data-speed="0.8"></span><span class="tj-dot"></span></span></div>
        </div>
        <div class="convo-scroll"><div class="convo" id="convo"></div></div>
        <div class="composer">
          <div id="tjHint" class="tj-hint" hidden></div>
          <div class="chatbox">
            <div class="dreamctx" id="dreamCtx" style="display:none"></div>

              <input id="tjInput" placeholder="Tell Toju what you're looking for…" autocomplete="off" />

                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
              </button>

              <button data-send="3-bed in Lekki under ₦180M">3-bed in Lekki under ₦180M</button>
              <button data-send="What can I afford on ₦2M a month?">What can I afford monthly?</button>
              <button data-send="Best value areas for a first home">Good areas for a first home</button>
            </div>
          </div>
        </div>
      </section>

      <!-- RIGHT: the matches canvas — full listings power, no browse trip needed -->
      <aside class="tj-canvas" style="position:relative">
        <div class="cv-head">
          <span class="cv-t">Your matches</span>
          <span class="cv-c" id="cvCount">0</span>
          <a class="cv-all" href="browse.html" title="Expand to the full Matches page">⤢ Expand</a>
        </div>
        <div class="cv-tools">
          <label class="cv-search">🔍<input id="cvQ" placeholder="Search title, area…" autocomplete="off" /></label>
          <div class="cv-deal" id="cvDeal">
            <button data-deal="all" class="on">All</button>
            <button data-deal="buy">Buy</button>
            <button data-deal="rent">Rent</button>
            <button data-deal="shared">Shared</button>
          </div>
          <select id="cvSort" title="Sort">
            <option value="new">Newest first</option>
            <option value="plow">Price · low → high</option>
            <option value="phigh">Price · high → low</option>
            <option value="trust">Trust score</option>
          </select>
          <div class="cv-view" id="cvView">
            <button data-view="grid" class="on" title="Grid view">▦</button>
            <button data-view="list" title="List view">☰</button>
          </div>
          <button class="cv-cmp-toggle" id="cvCmpToggle">⇄ Compare</button>
        </div>

        <!-- compare bar + Toju verdict sheet -->
        <div class="cv-cmpbar" id="cvCmpBar">
          <span id="cvCmpCount">0 selected</span>
          <button id="cvCmpGo">Toju's verdict →</button>
        </div>

          <div class="cv-sheet" id="cvSheet"></div>
        </div>
      </aside>

  </div>

  <script src="motion.js"></script>
  <script>
    const SUPABASE_URL = 'https://bhrhejpekmhbhwryjhgk.supabase.co';
    const ANON_KEY = 'sb_publishable_D25gO3eui5oI4L3h7bx-vg_fCHbo3LV';

    const convo = document.getElementById('convo');
    const input = document.getElementById('tjInput');
    const sendBtn = document.getElementById('tjSend');
    let busy = false;
    const STORE = 'toju_chat_v1';
    // stable anonymous visitor id -> server-side memory (continue anywhere this id exists)
    const VKEY = 'toju_visitor_v1';
    let VISITOR = localStorage.getItem(VKEY);
    if (!VISITOR) { VISITOR = crypto.randomUUID(); try { localStorage.setItem(VKEY, VISITOR); } catch (e) {} }
    const loadSaved = () => { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { return []; } };
    const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} };
    let saved = loadSaved();

    const esc = (s) => s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const convoScroll = document.querySelector('.convo-scroll');
    const scrollDown = () => {
      // scroll the chat pane on desktop; the window on mobile (canvas hidden)
      if (convoScroll && convoScroll.clientHeight < convoScroll.scrollHeight && getComputedStyle(convoScroll).overflowY !== 'visible') {
        convoScroll.scrollTo({ top: convoScroll.scrollHeight, behavior: 'smooth' });
      } else {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    };

    /* ── right-side MATCHES CANVAS — full listings power, chat-fed ──
       Accumulates every home Toju surfaces; the toolbar gives browse-page
       parity (search · deal filters · sort · grid/list · compare · expand). */
    const cvBody = document.getElementById('cvBody');
    const cvCount = document.getElementById('cvCount');
    let canvasMatches = [];
    const cvKeys = new Set();
    const keyOf = (m) => (m.title || '') + '|' + (m.price || '');
    const cv = { q: '', deal: 'all', sort: 'new', view: 'grid', cmpMode: false, cmp: new Set() };

    function collect(matches) {
      if (!Array.isArray(matches)) return;
      matches.forEach((m) => { const k = keyOf(m); if (!cvKeys.has(k)) { cvKeys.add(k); canvasMatches.unshift(m); } });
    }
    const dealOf = (m) => m.propertyType === 'shared' || (m.room != null) ? 'shared' : (m.listingType === 'rent' ? 'rent' : 'buy');
    function cvFiltered() {
      let list = canvasMatches.filter((m) => {
        if (cv.deal !== 'all' && dealOf(m) !== cv.deal) return false;
        if (cv.q) {
          const hay = ((m.title || '') + ' ' + (m.city || '') + ' ' + ((m.neighbourhood && m.neighbourhood.name) || '')).toLowerCase();
          if (!hay.includes(cv.q)) return false;
        }
        return true;
      });
      if (cv.sort === 'plow') list = [...list].sort((a, b) => (a.price || 0) - (b.price || 0));
      else if (cv.sort === 'phigh') list = [...list].sort((a, b) => (b.price || 0) - (a.price || 0));
      else if (cv.sort === 'trust') list = [...list].sort((a, b) => (b.trustScore || 0) - (a.trustScore || 0));
      return list;
    }
    const mid = (m) => m.id || keyOf(m);
    const tickHtml = (m) => cv.cmpMode
      ? '<span class="cv-tick' + (cv.cmp.has(mid(m)) ? ' on' : '') + '" data-tick="' + esc(mid(m)) + '" title="Select to compare">' + (cv.cmp.has(mid(m)) ? '✓' : '+') + '</span>'
      : '';
    function cvCardHtml(m) {
      const rent = m.listingType === 'rent';
      const deal = dealOf(m) === 'shared' ? 'Shared' : rent ? 'For rent' : 'For sale';
      const beds = Number(m.bedrooms) || 0;
      const why = m.why ? '<div class="cv-why"><b>Why:</b> ' + esc(m.why) + '</div>' : '';
      const yld = (m.yieldPct != null && m.yieldPct > 0) ? ' · ' + m.yieldPct + '% yield' : '';
      const area = (m.neighbourhood && m.neighbourhood.name) ? m.neighbourhood.name : (m.city || '');
      return '<a class="cv-card" href="property.html">'
        + '<div class="cv-banner"><span class="cv-dealchip">' + deal + '</span><span class="cv-trustchip">✦ ' + (Number(m.trustScore) || 0) + '</span>'
        + tickHtml(m)
        + '<div class="cv-bed"><b>' + beds + '</b><br><span>BEDROOM' + (beds === 1 ? '' : 'S') + '</span></div></div>'
        + '<div class="cv-cbody"><div class="cv-price">' + naira(m.price) + (rent || deal === 'Shared' ? '<small>/yr</small>' : '') + '</div>'
        + '<div class="cv-ttl">' + esc(m.title || '') + '</div>'
        + '<div class="cv-meta">' + esc(area) + yld + '</div>'
        + why + '</div></a>';
    }
    function cvRowHtml(m) {
      const rent = m.listingType === 'rent';
      const deal = dealOf(m);
      const beds = Number(m.bedrooms) || 0;
      const area = (m.neighbourhood && m.neighbourhood.name) ? m.neighbourhood.name : (m.city || '');
      return '<a class="cv-row" href="property.html">'
        + '<span class="rbed"><b>' + beds + '</b><span>BEDS</span></span>'
        + '<span class="rmain"><span class="rttl">' + esc(m.title || '') + '</span>'
        + '<span class="rmeta">' + esc(area) + ' · ' + (deal === 'shared' ? 'Shared room' : rent ? 'For rent' : 'For sale') + '</span>'
        + (m.why ? '<span class="rwhy"><b>Why:</b> ' + esc(m.why) + '</span>' : '') + '</span>'
        + '<span class="rtrust">✦ ' + (Number(m.trustScore) || 0) + '</span>'
        + '<span class="rprice">' + naira(m.price) + (rent || deal === 'shared' ? '<small>/yr</small>' : '') + '</span>'
        + tickHtml(m) + '</a>';
    }
    function renderCanvas() {
      const list = cvFiltered();
      cvCount.textContent = list.length + (list.length !== canvasMatches.length ? ' of ' + canvasMatches.length : '');
      if (canvasMatches.length === 0) {
        cvBody.innerHTML = '<div class="cv-empty"><span class="em-orb" data-lottie="orb-pulse" data-speed="0.8"></span>'
          + '<p>Your verified matches appear here as you chat — no need to open the browse page. Tell Toju what you\'re looking for.</p></div>';
        if (window.synMotion) synMotion.mount(cvBody.querySelector('[data-lottie]'));
        return;
      }
      if (list.length === 0) {
        cvBody.innerHTML = '<div class="cv-empty"><p>Nothing matches those filters. Clear the search or switch the deal filter.</p></div>';
        return;
      }
      cvBody.innerHTML = cv.view === 'list'
        ? '<div class="cv-rows">' + list.map(cvRowHtml).join('') + '</div>'
        : '<div class="cv-grid">' + list.map(cvCardHtml).join('') + '</div>';
      syncCmpBar();
    }
    function rebuildCanvas() {
      canvasMatches = []; cvKeys.clear(); cv.cmp.clear();
      saved.forEach((m) => { if (m.role === 'assistant') collect(m.matches); });
      renderCanvas();
    }

    /* toolbar wiring */
    document.getElementById('cvQ').addEventListener('input', (e) => { cv.q = e.target.value.trim().toLowerCase(); renderCanvas(); });
    document.getElementById('cvDeal').addEventListener('click', (e) => {
      const b = e.target.closest('[data-deal]'); if (!b) return;
      cv.deal = b.dataset.deal;
      document.querySelectorAll('#cvDeal button').forEach((x) => x.classList.toggle('on', x === b));
      renderCanvas();
    });
    document.getElementById('cvSort').addEventListener('change', (e) => { cv.sort = e.target.value; renderCanvas(); });
    document.getElementById('cvView').addEventListener('click', (e) => {
      const b = e.target.closest('[data-view]'); if (!b) return;
      cv.view = b.dataset.view;
      document.querySelectorAll('#cvView button').forEach((x) => x.classList.toggle('on', x === b));
      renderCanvas();
    });
    const cmpToggle = document.getElementById('cvCmpToggle');
    cmpToggle.addEventListener('click', () => {
      cv.cmpMode = !cv.cmpMode;
      if (!cv.cmpMode) cv.cmp.clear();
      cmpToggle.classList.toggle('on', cv.cmpMode);
      renderCanvas();
    });

    /* compare selection (ticks live inside card links — intercept before nav) */
    cvBody.addEventListener('click', (e) => {
      const t = e.target.closest('[data-tick]');
      if (!t) return;
      e.preventDefault(); e.stopPropagation();
      const id = t.dataset.tick;
      if (cv.cmp.has(id)) cv.cmp.delete(id);
      else if (cv.cmp.size < 4) cv.cmp.add(id);
      renderCanvas();
    });
    const cmpBar = document.getElementById('cvCmpBar');
    function syncCmpBar() {
      document.getElementById('cvCmpCount').textContent = cv.cmp.size + ' selected';
      cmpBar.classList.toggle('on', cv.cmpMode && cv.cmp.size >= 2);
    }

    /* Toju's verdict — the same compare Toju runs on the matches page */
    const sheetWrap = document.getElementById('cvSheetWrap');
    const sheet = document.getElementById('cvSheet');
    sheetWrap.addEventListener('click', (e) => { if (e.target === sheetWrap) sheetWrap.classList.remove('on'); });
    document.getElementById('cvCmpGo').addEventListener('click', async () => {
      const items = canvasMatches.filter((m) => cv.cmp.has(mid(m))).slice(0, 4);
      if (items.length < 2) return;
      sheet.innerHTML = '<button class="sh-x" onclick="this.closest(\'.cv-sheetwrap\').classList.remove(\'on\')">×</button>'
        + '<div class="sh-t">Toju is weighing these for you…</div>';
      sheetWrap.classList.add('on');
      let verdict = '', winnerId = null;
      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/toju-demo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
          body: JSON.stringify({ action: 'compare', visitorId: VISITOR, items: items.map((m) => ({
            id: mid(m), title: m.title, city: m.city, deal: dealOf(m), price: m.price, bedrooms: m.bedrooms,
            trustScore: m.trustScore, yieldPct: m.yieldPct, whatToWatch: m.whatToWatch, neighbourhood: m.neighbourhood,
          })) }),
        });
        const d = await res.json().catch(() => ({}));
        verdict = d.verdict || ''; winnerId = d.winnerId || null;
      } catch (e) {}
      const rows = items.map((m) => {
        const win = winnerId && mid(m) === winnerId;
        const rent = m.listingType === 'rent' || dealOf(m) === 'shared';
        return '<tr' + (win ? ' class="win"' : '') + '><td>' + (win ? '🏆 ' : '') + esc(m.title || '') + '</td>'
          + '<td>' + naira(m.price) + (rent ? '/yr' : '') + '</td><td>✦ ' + (m.trustScore || 0) + '</td>'
          + '<td>' + (m.yieldPct != null ? m.yieldPct + '%' : '—') + '</td>'
          + '<td>' + esc((m.neighbourhood && m.neighbourhood.name) || m.city || '') + '</td></tr>';
      }).join('');
      sheet.innerHTML = '<button class="sh-x" onclick="this.closest(\'.cv-sheetwrap\').classList.remove(\'on\')">×</button>'
        + '<div class="sh-t">Which one is better for you?</div>'
        + (verdict ? '<div class="verdict"><b>Toju:</b> ' + esc(verdict) + '</div>'
                   : '<div class="verdict">I couldn\'t reach Toju just now — the side-by-side is below; try the verdict again in a moment.</div>')
        + '<table><tr><th>Home</th><th>Price</th><th>Trust</th><th>Yield</th><th>Area</th></tr>' + rows + '</table>';
    });

    const naira = (n) => {
      n = Number(n) || 0;
      if (n >= 1e9) return '₦' + (n / 1e9).toFixed(n % 1e9 === 0 ? 0 : 1) + 'B';
      if (n >= 1e6) return '₦' + Math.round(n / 1e6) + 'M';
      return '₦' + n.toLocaleString();
    };
    function matchesHtml(matches) {
      if (!Array.isArray(matches) || matches.length === 0) return '';
      const cards = matches.map((m) => {
        const why = m.why ? '<div class="watch"><b>Why:</b> ' + esc(m.why) + '</div>' : '';
        const room = m.room ? '<div class="watch">' +
          (m.room.totalRooms - m.room.housematesIn) + ' of ' + m.room.totalRooms + ' rooms free · ' +
          (m.room.genderPreference === 'any' ? 'any gender' : m.room.genderPreference + '-only') +
          (m.room.ensuite ? ' · ensuite' : '') + (m.room.billsIncluded ? ' · bills incl.' : '') +
          (m.room.vibe ? ' · ' + esc(m.room.vibe) : '') + '</div>' : '';
        const watch = m.whatToWatch && m.whatToWatch !== 'No major synthetic flags'
          ? '<div class="watch"><b>Watch:</b> ' + esc(m.whatToWatch) + '</div>' : '';
        const yld = (m.yieldPct != null && m.yieldPct > 0) ? ' · ' + m.yieldPct + '% yield' : '';
        return '<a class="pcard" href="property.html">'
          + '<div class="pthumb"><b>' + (Number(m.bedrooms) || 0) + '</b><span>BED</span></div>'
          + '<div><div class="price">' + naira(m.price) + (m.listingType === 'rent' ? '<span style="font-size:12px;color:var(--ink-muted)">/yr</span>' : '') + '</div>'
          + '<div class="ttl">' + esc(m.title || '') + '</div>'
          + '<div class="meta"><span class="trust">✦ Trust ' + (Number(m.trustScore) || 0) + '</span> · '
          + esc(m.city || '') + yld + '</div>'
          + room + why + watch + '</div></a>';
      }).join('');
      return '<div class="matches-h"><span style="color:var(--brand)">✦</span><span class="lbl">VERIFIED MATCHES</span>'
        + '<span class="cnt">' + matches.length + '</span>'
        + '<a class="viewall" href="browse.html">View all →</a></div>' + cards;
    }

    function tojuMsg(text, matches) {
      const el = document.createElement('div');
      el.className = 'msg toju m-enter';
      el.innerHTML = '<div class="av av-toju">✦</div><div class="col"><div class="sender">Toju</div><div class="bubble">' + esc(text) + '</div>' + matchesHtml(matches) + '</div>';
      convo.appendChild(el); scrollDown();
    }
    function userMsg(text) {
      const el = document.createElement('div');
      el.className = 'msg user m-enter';
      el.innerHTML = '<div class="col"><div class="bubble">' + esc(text) + '</div></div><div class="av av-user">A</div>';
      convo.appendChild(el); scrollDown();
    }
    function typing() {
      const el = document.createElement('div');
      el.className = 'msg toju typing m-enter';
      el.innerHTML = '<div class="av av-toju">✦</div><div class="col"><div class="sender">Toju</div><div class="bubble"><span data-lottie="toju-typing" style="width:48px;height:20px"></span><span style="color:var(--ink-muted);font-style:italic">thinking…</span></div></div>';
      convo.appendChild(el);
      if (window.synMotion) synMotion.mount(el.querySelector('[data-lottie]'));
      scrollDown(); return el;
    }

    // ── Dream Home board → Toju's knowledge ──
    // Toju reads the visitor's mood board (title, vibe chips, pinned image
    // captions) and folds it into every conversation as silent context. The
    // message is sent to the model but never rendered in the chat.
    const DREAM_CTX_PREFIX = '[Background from my Dream Home mood board';
    // The dream context is sent to the model but must never surface in the UI:
    // the server persists it, so restored threads carry it — filter everywhere.
    const isDreamCtx = (m) => m && m.role === 'user' && typeof m.content === 'string' && m.content.startsWith(DREAM_CTX_PREFIX);
    function dreamContext() {
      try {
        const b = JSON.parse(localStorage.getItem('synapse_moodboard_v1'));
        if (!b) return null;
        const vibes = Array.isArray(b.vibe) ? b.vibe.filter(Boolean) : [];
        const caps = Array.isArray(b.images) ? [...new Set(b.images.map((i) => i && i.c).filter(Boolean))] : [];
        if (!vibes.length && !caps.length) return null;
        let s = '[Background from my Dream Home mood board, use it to shape what you recommend without repeating it back: ';
        s += 'board "' + (b.name || 'My dream home') + '"';
        if (vibes.length) s += ' · the vibe I love: ' + vibes.join(', ');
        if (caps.length) s += ' · spaces I keep pinning: ' + caps.join(', ');
        return s + '.]';
      } catch (e) { return null; }
    }

    async function ask() {
      const t = typing();
      try {
        const outgoing = saved.slice(-14).map((m) => ({ role: m.role, content: m.content }));
        const dream = dreamContext();
        if (dream) outgoing.unshift({ role: 'user', content: dream });
        const res = await fetch(SUPABASE_URL + '/functions/v1/toju-demo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
          body: JSON.stringify({ visitorId: VISITOR, messages: outgoing }),
        });
        const data = await res.json().catch(() => ({}));
        t.remove();
        if (!res.ok || data.error || !data.reply) {
          tojuMsg("I'm having a moment connecting — mind trying that again in a second?");
        } else {
          const matches = (data.showMatches === true && Array.isArray(data.matches)) ? data.matches : [];
          saved.push({ role: 'assistant', content: data.reply, matches });
          persist();
          tojuMsg(data.reply, matches);
          collect(matches); renderCanvas();
          renderSuggest(data.suggestions);
        }
      } catch (e) {
        t.remove();
        tojuMsg("I'm having a moment connecting — mind trying that again in a second?");
      }
      busy = false; scrollDown();
    }

    function send(text) {
      const v = (text != null ? text : input.value).trim();
      if (!v || busy) return;
      busy = true; input.value = '';
      saved.push({ role: 'user', content: v });
      persist();
      userMsg(v);
      ask();
    }

    // suggestions are DYNAMIC — Toju sends tap-to-answer options for the
    // question it just asked ("Married with kids", "Just me", …)
    const suggestEl = document.getElementById('tjSuggest');
    const DEFAULT_SUGGEST = suggestEl.innerHTML;
    function renderSuggest(list) {
      if (Array.isArray(list) && list.length) {
        suggestEl.innerHTML = list.map((s) =>
          '<button data-send="' + esc(s) + '">' + esc(s) + '</button>').join('');
      } else {
        suggestEl.innerHTML = DEFAULT_SUGGEST;
      }
    }
    suggestEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-send]'); if (b) send(b.getAttribute('data-send'));
    });
    sendBtn.addEventListener('click', () => send());
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });

    /* ───────── voice typing (Web Speech API) ───────── */
    const micBtn = document.getElementById('tjMic');
    const hintEl = document.getElementById('tjHint');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const inIframe = window.self !== window.top;
    let recog = null, listening = false, hintTimer = null;

    function hint(msg) {
      hintEl.textContent = msg; hintEl.hidden = false;
      clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintEl.hidden = true; }, 5000);
    }
    function stopMicUI() { listening = false; micBtn.classList.remove('listening'); input.placeholder = "Tell Toju what you're looking for…"; }
    function startMic() {
      recog = new SR();
      recog.lang = 'en-NG'; recog.interimResults = true; recog.continuous = true;
      const base = input.value.trim() ? input.value.trim() + ' ' : '';
      recog.onresult = (e) => {
        let txt = '';
        for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
        input.value = base + txt;
      };
      recog.onerror = (e) => {
        stopMicUI();
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          hint(inIframe
            ? 'Open this page in its own browser tab to use voice — it’s blocked inside the embedded preview.'
            : 'Microphone is blocked. Click the mic/🔒 icon in the address bar → Allow, then tap the mic again.');
        } else if (e.error === 'no-speech') { hint("Didn’t catch that — tap the mic and speak."); }
      };
      recog.onend = () => stopMicUI();
      try { recog.start(); listening = true; micBtn.classList.add('listening'); input.placeholder = 'Listening… speak now'; input.focus(); }
      catch (err) { stopMicUI(); }
    }
    async function toggleMic() {
      if (!SR) { hint('Voice typing needs Chrome or Edge on this device.'); return; }
      if (!window.isSecureContext) { hint('Voice needs a secure page — open the app on localhost or https, not a raw IP address.'); return; }
      if (listening) { try { recog && recog.stop(); } catch (e) {} stopMicUI(); return; }
      // Ask for mic permission the reliable way (getUserMedia shows the prompt);
      // SpeechRecognition alone often throws "not-allowed" without ever asking.
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach((t) => t.stop()); // we only needed the grant
        } catch (err) {
          stopMicUI();
          const n = err && err.name;
          if (n === 'NotAllowedError' || n === 'SecurityError') {
            hint(inIframe
              ? 'Open this page in its own browser tab to use voice — the embedded preview blocks the mic.'
              : 'Mic access is blocked for this site. Click the 🔒 (or camera) icon in the address bar → set Microphone to Allow → then tap the mic again.');
          } else if (n === 'NotFoundError' || n === 'DevicesNotFoundError') {
            hint('No microphone found on this device.');
          } else {
            hint('Couldn’t reach the mic — check your browser’s microphone permissions and try again.');
          }
          return;
        }
      }
      startMic();
    }
    micBtn.addEventListener('click', toggleMic);

    // restore the saved conversation so people continue where they left off:
    // local copy renders instantly, then the server copy (visitor id) wins.
    const GREETING = "Good afternoon. I'm Toju — your consultant at Synapse. Tell me what you're looking for and I'll find verified homes that fit. No forms, no endless scrolling.";
    function render() {
      convo.innerHTML = '';
      saved.forEach((m) => { if (isDreamCtx(m)) return; (m.role === 'user' ? userMsg(m.content) : tojuMsg(m.content, Array.isArray(m.matches) ? m.matches : [])); });
      rebuildCanvas();
    }
    // scrub any hidden context that leaked into storage before the filter existed
    if (saved.some(isDreamCtx)) { saved = saved.filter((m) => !isDreamCtx(m)); persist(); }
    if (saved.length === 0) { saved = [{ role: 'assistant', content: GREETING }]; persist(); }
    render();
    // Server restore — strictly a fallback for continuing on another device.
    // Guard rails: drop hidden dream-context messages, ignore the response if
    // the visitor rotated (New chat) meanwhile, and never let a server copy
    // (which has no per-message matches) clobber an equally long local thread.
    const restoreFor = VISITOR;
    fetch(SUPABASE_URL + '/functions/v1/toju-demo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ action: 'restore', visitorId: VISITOR }),
    }).then((r) => r.json()).then((d) => {
      if (VISITOR !== restoreFor) return;
      const msgs = (Array.isArray(d.messages) ? d.messages : []).filter((m) => !isDreamCtx(m));
      if (msgs.length > saved.length) {
        saved = msgs; persist(); render(); rebuildCanvas();
      }
    }).catch(() => {});

    // deep link from a listing: ?ask=... pre-fills the composer
    const askParam = new URLSearchParams(location.search).get('ask');
    if (askParam) { input.value = askParam.slice(0, 300); input.focus(); scrollDown(); }

    // the dream-board chip — makes Toju's silent context visible
    (function () {
      try {
        const b = JSON.parse(localStorage.getItem('synapse_moodboard_v1'));
        const vibes = b && Array.isArray(b.vibe) ? b.vibe.filter(Boolean) : [];
        if (!vibes.length) return;
        const el = document.getElementById('dreamCtx');
        el.innerHTML = '✦&nbsp;<span>Toju knows your dream — <b>' + esc(vibes.slice(0, 3).join(', ')) + (vibes.length > 3 ? '…' : '') + '</b></span><a href="dream.html">Edit board</a>';
        el.style.display = 'flex';
      } catch (e) {}
    })();

    // new chat — fresh visitor id, so the server thread starts clean too
    function newChat() {
      localStorage.removeItem(STORE);
      VISITOR = crypto.randomUUID(); try { localStorage.setItem(VKEY, VISITOR); } catch (e) {}
      saved = [{ role: 'assistant', content: GREETING }]; persist(); convo.innerHTML = ''; tojuMsg(GREETING);
      rebuildCanvas();
      renderSuggest(null);
    }
    const nc = document.getElementById('tjNew');
    if (nc) nc.addEventListener('click', newChat);
  </script>
</body>
</html>
