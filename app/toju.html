<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toju — Synapse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="motion.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* ── TRUE GLASSMORPHISM, WARM & LIGHT ──
       Frosted glass over a bright warm interior: translucent white gradient
       fills, heavy backdrop blur, a thin luminous rim, a soft top highlight.
       Off-white with a breath of terracotta — never dark. */
    .tj-orb { position: absolute; width: 56px; height: 56px; margin: -16px 0 0 -6px; opacity: .6; pointer-events: none; }
    body { background: #f5f5f5; }
    .tj-bg { position: fixed; inset: 0; z-index: 0;
      background: url('https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat; }
    /* whisper of a warm wash — the photo stays CLEAR; glass does the frosting */
    .tj-wash { position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(120% 80% at 78% 0%, rgba(212,110,60,0.14), transparent 58%),
        linear-gradient(180deg, rgba(250,242,234,0.18) 0%, rgba(248,238,228,0.22) 55%, rgba(244,230,216,0.38) 100%); }

    /* glass recipe, shared — light frost with a luminous rim */
    .toju .bubble, .chatbox, .pcard, .tj-hint {
      background: linear-gradient(135deg, rgba(255,255,255,0.66), rgba(255,251,246,0.38));
      backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 18px 44px rgba(122,62,22,0.13), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .appbar { background: rgba(245,245,245,0.6); backdrop-filter: blur(24px) saturate(1.5); border-bottom: 1px solid rgba(255,255,255,0.6); }

    .wrap { position: relative; z-index: 1; }
    .tj-head { padding-top: 8px; }
    .tj-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #121212; }
    .tj-title { font-family: var(--f-serif); font-weight: 500; font-size: 40px; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: center; gap: 10px; margin-top: 2px; }
    .tj-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px rgba(46,125,79,0.14); }

    .convo { display: flex; flex-direction: column; gap: 18px; padding-top: 22px; }
    .msg { display: flex; align-items: flex-end; gap: 9px; }
    .msg.user { flex-direction: row-reverse; }
    .col { max-width: 84%; display: flex; flex-direction: column; }
    .av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .av-toju { background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 6px 16px rgba(150,70,20,0.25); }
    .av-user { background: rgba(255,255,255,0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.8); color: var(--ink-muted); font-size: 13px; font-weight: 600; }
    .sender { font-size: 11.5px; font-weight: 600; color: #121212; margin: 0 0 5px 3px; }

    .bubble { padding: 13px 16px; border-radius: 20px; font-size: 14.5px; line-height: 1.55; }
    .toju .bubble { color: var(--ink); border-bottom-left-radius: 6px; }
    .user .bubble { background: linear-gradient(135deg, rgba(54,54,54,0.82), rgba(235,100,30,0.62));
      backdrop-filter: blur(22px) saturate(1.7); -webkit-backdrop-filter: blur(22px) saturate(1.7); color: #fff;
      border: 1px solid rgba(255,255,255,0.5); border-bottom-right-radius: 6px;
      box-shadow: 0 14px 32px rgba(200,95,30,0.28), inset 0 1px 0 rgba(255,255,255,0.4); }

    .matches-h { display: flex; align-items: center; gap: 7px; margin: 12px 0 8px; }
    .matches-h .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #121212; }
    .matches-h .cnt { font-size: 11px; font-weight: 700; color: #121212; background: rgba(54,54,54,0.1); border: 1px solid rgba(54,54,54,0.2); border-radius: 9px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .matches-h .viewall { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #121212; text-decoration: none; }
    .matches-h .viewall:hover { text-decoration: underline; }
    .pcard { display: flex; gap: 13px; margin-top: 9px; padding: 11px; border-radius: 15px; cursor: pointer; transition: all .2s; color: var(--ink); }
    .pcard, .pcard * { text-decoration: none; }
    .pcard:hover { transform: translateY(-1px); border-color: rgba(54,54,54,0.45); }
    .pcard img { width: 62px; height: 62px; border-radius: 12px; object-fit: cover; }
    .pcard .pthumb { width: 62px; height: 62px; border-radius: 12px; flex: none; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; font-family: var(--f-serif);
      background: linear-gradient(135deg, #121212, #121212); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); }
    .pcard .pthumb b { font-size: 20px; line-height: 1; }
    .pcard .pthumb span { font-size: 9px; letter-spacing: .08em; opacity: .9; margin-top: 3px; }
    .pcard .price { font-family: var(--f-serif); font-weight: 600; font-size: 21px; font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; color: var(--brand); }
    .pcard .ttl { font-size: 13px; font-weight: 500; color: var(--ink); }
    .pcard .meta { font-size: 11.5px; color: var(--ink-muted); }
    .pcard .watch { font-size: 11px; color: var(--ink-muted); margin-top: 3px; }
    .pcard .watch b { color: #b0521f; font-weight: 600; }
    .pcard .trust { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--brand); }

    .typing .bubble { display: flex; align-items: center; gap: 9px; }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: inline-block; animation: tjpulse 1.1s infinite; }
    .typing-dots i:nth-child(2) { animation-delay: .18s; } .typing-dots i:nth-child(3) { animation-delay: .36s; }
    @keyframes tjpulse { 0%,60%,100%{opacity:.25} 30%{opacity:1} }

    /* composer — one frosted chatbox: input on top, suggestions tucked at the bottom */
    .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 14px 22px 34px;
      display: flex; flex-direction: column; align-items: center; gap: 9px; background: none; }
    .tj-hint { width: 100%; max-width: 480px; text-align: center; font-size: 12.5px; color: var(--ink-muted); border-radius: 12px; padding: 8px 14px; }
    .chatbox { width: 100%; max-width: 480px; border-radius: 24px; padding: 6px 6px 8px;
      backdrop-filter: blur(36px) saturate(1.6); -webkit-backdrop-filter: blur(36px) saturate(1.6); }
    .pillrow { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 15px; }
    .pillrow input { flex: 1; border: none; outline: none; font-family: var(--f-sans); font-size: 14.5px; background: transparent; color: var(--ink); }
    .pillrow input::placeholder { color: rgba(21,23,26,0.45); }
    .mic, .send { width: 38px; height: 38px; border-radius: 13px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
    .mic { background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.85); color: var(--ink-muted); }
    .mic.listening { background: var(--brand); color: #fff; animation: micpulse 1.3s infinite; }
    @keyframes micpulse { 0%{ box-shadow: 0 0 0 0 rgba(54,54,54,0.5);} 70%{ box-shadow: 0 0 0 10px rgba(54,54,54,0);} 100%{ box-shadow: 0 0 0 0 rgba(54,54,54,0);} }
    .send { background: var(--brand); color: #fff; font-size: 17px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); }
    .send:disabled { opacity: .45; }
    .chatbox .suggest { display: flex; gap: 7px; padding: 9px 5px 2px; margin-top: 4px; overflow-x: auto; border-top: 1px solid rgba(255,255,255,0.6); }
    .chatbox .suggest::-webkit-scrollbar { display: none; }
    .chatbox .suggest button { white-space: nowrap; font-family: var(--f-sans); font-size: 12px; font-weight: 500; color: rgba(21,23,26,0.7); cursor: pointer;
      background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); border-radius: 100px; padding: 6px 12px; transition: all .18s; }
    .chatbox .suggest button:hover { color: var(--ink); border-color: rgba(54,54,54,0.45); background: rgba(255,255,255,0.7); }
    .convo-wrap { padding-bottom: 180px; }

    /* ── TWO-PANE CANVAS LAYOUT (chat left · listings right) ── */
    html, body { height: 100%; }
    body { overflow: hidden; }
    .tj-app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100dvh; }
    .tj-app .appbar { flex: none; }
    .tj-layout { flex: 1; display: flex; min-height: 0; }
    /* The chat opens centered, exactly like the original Toju page. The moment
       Toju surfaces matches, the page morphs into the Gemini-canvas split —
       chat 25% left, matches canvas 75% right. */
    .tj-chat { display: flex; flex-direction: column; min-height: 0; width: 100%; max-width: 780px; margin: 0 auto; transition: max-width .35s cubic-bezier(.22,1,.36,1); }
    body.has-canvas .tj-chat { width: 25%; min-width: 280px; max-width: none; margin: 0; border-right: 1px solid rgba(255,255,255,0.55); }
    .tj-chat .tj-head { flex: none; padding: 16px 22px 4px; }
    .convo-scroll { flex: 1; overflow-y: auto; padding: 8px 22px 12px; }
    .convo-scroll::-webkit-scrollbar { width: 7px; } .convo-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }
    .convo-scroll .convo { padding-top: 8px; }
    .tj-chat .composer { position: static; flex: none; padding: 10px 16px 16px; }
    .tj-chat .chatbox, .tj-chat .tj-hint { max-width: none; }

    /* right matches canvas — a live preview of the Your-matches page.
       Hidden until Toju has something to show. */
    .tj-canvas { flex: 1; display: none; flex-direction: column; min-height: 0; }
    body.has-canvas .tj-canvas { display: flex; animation: cvIn .4s cubic-bezier(.22,1,.36,1); }
    @keyframes cvIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    .cv-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.5); }
    .cv-head .cv-t { font-family: var(--f-serif); font-weight: 500; font-size: 23px; color: var(--ink); }
    .cv-head .cv-c { font-size: 12px; font-weight: 700; color: #121212; background: rgba(54,54,54,0.1); border: 1px solid rgba(54,54,54,0.2); border-radius: 100px; padding: 2px 10px; }
    .cv-head .cv-all { margin-left: auto; font-size: 12.5px; font-weight: 600; color: #121212; text-decoration: none; }
    .cv-head .cv-all:hover { text-decoration: underline; }
    .cv-body { flex: 1; overflow-y: auto; padding: 22px 24px 40px; }
    .cv-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--ink-muted); gap: 10px; padding: 40px; }
    .cv-empty .em-orb { width: 66px; height: 66px; opacity: .8; }
    .cv-empty p { font-size: 14.5px; max-width: 330px; line-height: 1.65; }
    /* ── EXACT Your-matches page card + map styles (browse.html parity).
       Class names and rules match browse.html so the canvas IS a live
       preview of that page. Keep the two files in sync. ── */
    #cvMap { height: 230px; border-radius: var(--radius); margin-bottom: 16px; position: relative; z-index: 1;
      border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 18px 44px rgba(122,62,22,0.13); }
    .price-pin { background: var(--brand); color: #fff; font: 700 11px/1 var(--f-sans); padding: 5px 9px; border-radius: 100px;
      box-shadow: 0 4px 12px rgba(150,70,20,0.4); white-space: nowrap; border: 1.5px solid #fff; }
    .price-pin.dim { background: #8b8b8b; }
    .chip-unv { background: rgba(0,0,0,0.05); color: var(--ink-muted); border: 1px solid rgba(0,0,0,0.12); }
    .chip-prog { background: rgba(176,125,43,0.1); color: #a8742b; border: 1px solid rgba(176,125,43,0.28); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
    .listing { display: flex; flex-direction: column; overflow: hidden; cursor: pointer; position: relative;
      transition: opacity var(--m-expanded) var(--m-ease), transform var(--m-expanded) var(--m-ease), box-shadow .25s, border-color .25s; }
    .listing:hover { transform: translateY(-4px); box-shadow: 0 26px 56px rgba(122,62,22,0.16), inset 0 1px 0 rgba(255,255,255,0.9); border-color: rgba(54,54,54,0.4); }
    .listing .body { padding: 18px 18px 14px; }
    .listing .tags { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
    .listing .match { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: #121212; background: rgba(54,54,54,0.1); border: 1px solid rgba(54,54,54,0.22); padding: 3px 9px; border-radius: 100px; }
    .listing .price { font-family: var(--f-serif); font-weight: 600; font-size: 27px; font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; color: var(--brand); }
    .listing .ttl { font-size: 14.5px; font-weight: 500; margin-top: 2px; }
    .listing .loc { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
    .listing .why { font-size: 12.5px; line-height: 1.55; color: var(--ink-muted); margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.7); }
    .listing .why b { color: #b0521f; font-weight: 600; }
    .listing .score { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 12px; color: var(--ink-muted); }
    .listing .ring { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--success); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--ink); }
    .listing .score.unv { color: var(--ink-dim); }
    .listing .ring.unv { border-color: rgba(0,0,0,0.22); color: var(--ink-dim); font-size: 12px; }
    .listing .img { position: relative; height: 170px; margin: 0 10px 10px; border-radius: 15px; overflow: hidden; }
    .listing .img img { width: 100%; height: 100%; object-fit: cover; }
    .listing .save { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.75);
      display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; transition: transform var(--m-micro) var(--m-ease); }
    .listing .save.on { color: #121212; background: rgba(255,255,255,0.85); }
    .listing .save:active { transform: scale(0.85); }


    /* desktop shows the canvas (hide inline chat cards); mobile keeps inline cards, hides canvas */
    @media (min-width: 900px) { .tj-chat .matches-h, .tj-chat .pcard { display: none; } }
    @media (max-width: 899px) {
      body { overflow: auto; }
      .tj-app { height: auto; min-height: 100dvh; }
      .tj-layout { flex-direction: column; }
      .tj-chat, body.has-canvas .tj-chat { width: 100%; max-width: none; min-width: 0; border-right: none; margin: 0; }
      .convo-scroll { overflow: visible; }
      .tj-chat .composer { position: sticky; bottom: 0; }
      .tj-canvas, body.has-canvas .tj-canvas { display: none; }
    }
  </style>
</head>
<body>
  <div class="tj-bg"></div>
  <div class="tj-wash"></div>

  <div class="tj-app">
    <div class="appbar">
      <a class="brand" href="../index.html">
        <svg viewBox="0 0 64 78" fill="#15171a"><rect x="0" y="0" width="10" height="78" rx="1"/><rect x="10" y="0" width="44" height="10" rx="1"/><rect x="44" y="10" width="10" height="17" rx="1"/><rect x="10" y="17" width="44" height="10" rx="1"/><rect x="10" y="36" width="44" height="10" rx="1"/><rect x="46" y="46" width="8" height="22" rx="1"/><rect x="18" y="46" width="8" height="22" rx="1"/><rect x="10" y="68" width="44" height="10" rx="1"/></svg>
        Synapse
      </a>
      <nav>
        <a href="toju.html" class="active">Toju</a>
        <a href="browse.html">Your matches</a>
        <a href="dream.html">Dream Home</a>
      </nav>
      <span class="spacer"></span>
      <button id="tjNew" class="home" style="background:none;border:none;cursor:pointer;font:inherit;margin-right:18px">↺ New chat</button>
      <a class="home" href="../index.html">← Back to site</a>
    </div>

    <div class="tj-layout">
      <!-- LEFT: the chat (smaller window) -->
      <section class="tj-chat">
        <div class="tj-head">
          <div class="tj-eyebrow">AI Property Consultant</div>
          <div class="tj-title">Toju <span style="position:relative"><span class="tj-orb" data-lottie="orb-pulse" data-speed="0.8"></span><span class="tj-dot"></span></span></div>
        </div>
        <div class="convo-scroll"><div class="convo" id="convo"></div></div>
        <div class="composer">
          <div id="tjHint" class="tj-hint" hidden></div>
          <div class="chatbox">
            <div class="pillrow">
              <input id="tjInput" placeholder="Tell Toju what you're looking for…" autocomplete="off" />
              <button class="mic" id="tjMic" title="Voice typing" aria-label="Voice typing">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
              </button>
              <button class="send" id="tjSend" title="Send" aria-label="Send">↑</button>
            </div>
            <div class="suggest" id="tjSuggest">
              <button data-send="3-bed in Lekki under ₦180M">3-bed in Lekki under ₦180M</button>
              <button data-send="What can I afford on ₦2M a month?">What can I afford monthly?</button>
              <button data-send="Best value areas for a first home">Good areas for a first home</button>
            </div>
          </div>
        </div>
      </section>

      <!-- RIGHT: the matches canvas — a live preview of the Your-matches page.
           No toolbar: whatever the user wants (cheaper, bigger, another area),
           they just tell Toju. Expand opens the full page. -->
      <aside class="tj-canvas">
        <div class="cv-head">
          <span class="cv-t">Your matches</span>
          <span class="cv-c" id="cvCount">0</span>
          <a class="cv-all" href="browse.html" title="Expand to the full Matches page">⤢ Expand</a>
        </div>
        <div class="cv-body" id="cvBody">
          <div id="cvMap"></div>
          <div class="grid" id="cvGrid"></div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="matches-shared.js"></script>
  <script src="motion.js"></script>
  <script>
    const SUPABASE_URL = 'https://bhrhejpekmhbhwryjhgk.supabase.co';
    const ANON_KEY = 'sb_publishable_D25gO3eui5oI4L3h7bx-vg_fCHbo3LV';

    const convo = document.getElementById('convo');
    const input = document.getElementById('tjInput');
    const sendBtn = document.getElementById('tjSend');
    let busy = false;
    const STORE = 'toju_chat_v1';
    // stable anonymous visitor id -> server-side memory (continue anywhere this id exists)
    const VKEY = 'toju_visitor_v1';
    let VISITOR = localStorage.getItem(VKEY);
    if (!VISITOR) { VISITOR = crypto.randomUUID(); try { localStorage.setItem(VKEY, VISITOR); } catch (e) {} }
    const loadSaved = () => { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { return []; } };
    const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} };
    let saved = loadSaved();

    // shared with browse.html — see matches-shared.js + docs/STATE_CONTRACT.md
    const { esc, naira } = window.SynMatches;
    const convoScroll = document.querySelector('.convo-scroll');
    const scrollDown = () => {
      // scroll the chat pane on desktop; the window on mobile (canvas hidden)
      if (convoScroll && convoScroll.clientHeight < convoScroll.scrollHeight && getComputedStyle(convoScroll).overflowY !== 'visible') {
        convoScroll.scrollTo({ top: convoScroll.scrollHeight, behavior: 'smooth' });
      } else {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    };

    /* ── right-side MATCHES CANVAS — a live preview of the Your-matches page.
       Cards, map and layout mirror browse.html EXACTLY (keep in sync with that
       page). No toolbar: whatever the user wants changed, they tell Toju. The
       page opens as a centered chat and morphs to 25/75 when matches land. ── */
    const cvGrid = document.getElementById('cvGrid');
    const cvCount = document.getElementById('cvCount');
    let canvasMatches = [];
    const cvKeys = new Set();
    const keyOf = (m) => (m.title || '') + '|' + (m.price || '');
    function collect(matches) {
      if (!Array.isArray(matches)) return;
      matches.forEach((m) => { const k = keyOf(m); if (!cvKeys.has(k)) { cvKeys.add(k); canvasMatches.unshift(m); } });
    }

    // browse.html parity: shaper, card markup and map all come from
    // matches-shared.js — the canvas renders the SAME card browse.html does
    // (compare checkboxes are a browse-only tool; here you just tell Toju).
    let cvSaves = new Set(JSON.parse(localStorage.getItem('synapse_saved') || '[]'));
    const cvMapState = {}; // persistent {map, layer} for SynMatches.drawMatchMap

    function renderCanvas() {
      const items = canvasMatches.map(SynMatches.shapeTojuMatch);
      cvCount.textContent = items.length;
      document.body.classList.toggle('has-canvas', items.length > 0);
      if (items.length === 0) { cvGrid.innerHTML = ''; return; }
      cvGrid.innerHTML = items.map((l, i) => SynMatches.listingCardHtml(l, i, { saves: cvSaves })).join('');
      SynMatches.drawMatchMap(cvMapState, 'cvMap', items);
      if (window.synMotion) synMotion.refresh();
    }
    cvGrid.addEventListener('click', (e) => {
      const sv = e.target.closest('[data-save]');
      if (sv) {
        const id = sv.getAttribute('data-save');
        cvSaves.has(id) ? cvSaves.delete(id) : cvSaves.add(id);
        localStorage.setItem('synapse_saved', JSON.stringify([...cvSaves]));
        renderCanvas(); return;
      }
      if (e.target.closest('.listing')) window.location.href = 'property.html';
    });
    function rebuildCanvas() {
      canvasMatches = []; cvKeys.clear();
      saved.forEach((m) => { if (m.role === 'assistant') collect(m.matches); });
      renderCanvas();
    }


    function matchesHtml(matches) {
      if (!Array.isArray(matches) || matches.length === 0) return '';
      const cards = matches.map((m) => {
        const why = m.why ? '<div class="watch"><b>Why:</b> ' + esc(m.why) + '</div>' : '';
        const room = m.room ? '<div class="watch">' +
          (m.room.totalRooms - m.room.housematesIn) + ' of ' + m.room.totalRooms + ' rooms free · ' +
          (m.room.genderPreference === 'any' ? 'any gender' : m.room.genderPreference + '-only') +
          (m.room.ensuite ? ' · ensuite' : '') + (m.room.billsIncluded ? ' · bills incl.' : '') +
          (m.room.vibe ? ' · ' + esc(m.room.vibe) : '') + '</div>' : '';
        const watch = m.whatToWatch && m.whatToWatch !== 'No major synthetic flags'
          ? '<div class="watch"><b>Watch:</b> ' + esc(m.whatToWatch) + '</div>' : '';
        const yld = (m.yieldPct != null && m.yieldPct > 0) ? ' · ' + m.yieldPct + '% yield' : '';
        return '<a class="pcard" href="property.html">'
          + '<div class="pthumb"><b>' + (Number(m.bedrooms) || 0) + '</b><span>BED</span></div>'
          + '<div><div class="price">' + naira(m.price) + (m.listingType === 'rent' ? '<span style="font-size:12px;color:var(--ink-muted)">/yr</span>' : '') + '</div>'
          + '<div class="ttl">' + esc(m.title || '') + '</div>'
          + '<div class="meta"><span class="trust">✦ Trust ' + (Number(m.trustScore) || 0) + '</span> · '
          + esc(m.city || '') + yld + '</div>'
          + room + why + watch + '</div></a>';
      }).join('');
      return '<div class="matches-h"><span style="color:var(--brand)">✦</span><span class="lbl">VERIFIED MATCHES</span>'
        + '<span class="cnt">' + matches.length + '</span>'
        + '<a class="viewall" href="browse.html">View all →</a></div>' + cards;
    }

    function tojuMsg(text, matches) {
      const el = document.createElement('div');
      el.className = 'msg toju m-enter';
      el.innerHTML = '<div class="av av-toju">✦</div><div class="col"><div class="sender">Toju</div><div class="bubble">' + esc(text) + '</div>' + matchesHtml(matches) + '</div>';
      convo.appendChild(el); scrollDown();
    }
    function userMsg(text) {
      const el = document.createElement('div');
      el.className = 'msg user m-enter';
      el.innerHTML = '<div class="col"><div class="bubble">' + esc(text) + '</div></div><div class="av av-user">A</div>';
      convo.appendChild(el); scrollDown();
    }
    function typing() {
      const el = document.createElement('div');
      el.className = 'msg toju typing m-enter';
      el.innerHTML = '<div class="av av-toju">✦</div><div class="col"><div class="sender">Toju</div><div class="bubble"><span data-lottie="toju-typing" style="width:48px;height:20px"></span><span style="color:var(--ink-muted);font-style:italic">thinking…</span></div></div>';
      convo.appendChild(el);
      if (window.synMotion) synMotion.mount(el.querySelector('[data-lottie]'));
      scrollDown(); return el;
    }

    // ── Dream Home board → Toju's knowledge ──
    // Toju reads the visitor's mood board (title, vibe chips, pinned image
    // captions) and folds it into every conversation as silent context. The
    // message is sent to the model but never rendered in the chat.
    const DREAM_CTX_PREFIX = '[Background from my Dream Home mood board';
    // The dream context is sent to the model but must never surface in the UI:
    // the server persists it, so restored threads carry it — filter everywhere.
    const isDreamCtx = (m) => m && m.role === 'user' && typeof m.content === 'string' && m.content.startsWith(DREAM_CTX_PREFIX);
    function dreamContext() {
      try {
        const b = JSON.parse(localStorage.getItem('synapse_moodboard_v1'));
        if (!b) return null;
        const vibes = Array.isArray(b.vibe) ? b.vibe.filter(Boolean) : [];
        const caps = Array.isArray(b.images) ? [...new Set(b.images.map((i) => i && i.c).filter(Boolean))] : [];
        if (!vibes.length && !caps.length) return null;
        let s = '[Background from my Dream Home mood board, use it to shape what you recommend without repeating it back: ';
        s += 'board "' + (b.name || 'My dream home') + '"';
        if (vibes.length) s += ' · the vibe I love: ' + vibes.join(', ');
        if (caps.length) s += ' · spaces I keep pinning: ' + caps.join(', ');
        return s + '.]';
      } catch (e) { return null; }
    }

    async function ask() {
      const t = typing();
      try {
        const outgoing = saved.slice(-14).map((m) => ({ role: m.role, content: m.content }));
        const dream = dreamContext();
        if (dream) outgoing.unshift({ role: 'user', content: dream });
        const res = await fetch(SUPABASE_URL + '/functions/v1/toju-demo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
          body: JSON.stringify({ visitorId: VISITOR, messages: outgoing }),
        });
        const data = await res.json().catch(() => ({}));
        t.remove();
        if (!res.ok || data.error || !data.reply) {
          tojuMsg("I'm having a moment connecting — mind trying that again in a second?");
        } else {
          const matches = (data.showMatches === true && Array.isArray(data.matches)) ? data.matches : [];
          saved.push({ role: 'assistant', content: data.reply, matches });
          persist();
          tojuMsg(data.reply, matches);
          collect(matches); renderCanvas();
          renderSuggest(data.suggestions);
        }
      } catch (e) {
        t.remove();
        tojuMsg("I'm having a moment connecting — mind trying that again in a second?");
      }
      busy = false; scrollDown();
    }

    function send(text) {
      const v = (text != null ? text : input.value).trim();
      if (!v || busy) return;
      busy = true; input.value = '';
      saved.push({ role: 'user', content: v });
      persist();
      userMsg(v);
      ask();
    }

    // suggestions are DYNAMIC — Toju sends tap-to-answer options for the
    // question it just asked ("Married with kids", "Just me", …)
    const suggestEl = document.getElementById('tjSuggest');
    const DEFAULT_SUGGEST = suggestEl.innerHTML;
    function renderSuggest(list) {
      if (Array.isArray(list) && list.length) {
        suggestEl.innerHTML = list.map((s) =>
          '<button data-send="' + esc(s) + '">' + esc(s) + '</button>').join('');
      } else {
        suggestEl.innerHTML = DEFAULT_SUGGEST;
      }
    }
    suggestEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-send]'); if (b) send(b.getAttribute('data-send'));
    });
    sendBtn.addEventListener('click', () => send());
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });

    /* ───────── voice typing (Web Speech API) ───────── */
    const micBtn = document.getElementById('tjMic');
    const hintEl = document.getElementById('tjHint');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const inIframe = window.self !== window.top;
    let recog = null, listening = false, hintTimer = null;

    function hint(msg) {
      hintEl.textContent = msg; hintEl.hidden = false;
      clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintEl.hidden = true; }, 5000);
    }
    function stopMicUI() { listening = false; micBtn.classList.remove('listening'); input.placeholder = "Tell Toju what you're looking for…"; }
    function startMic() {
      recog = new SR();
      recog.lang = 'en-NG'; recog.interimResults = true; recog.continuous = true;
      const base = input.value.trim() ? input.value.trim() + ' ' : '';
      recog.onresult = (e) => {
        let txt = '';
        for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
        input.value = base + txt;
      };
      recog.onerror = (e) => {
        stopMicUI();
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          hint(inIframe
            ? 'Open this page in its own browser tab to use voice — it’s blocked inside the embedded preview.'
            : 'Microphone is blocked. Click the mic/🔒 icon in the address bar → Allow, then tap the mic again.');
        } else if (e.error === 'no-speech') { hint("Didn’t catch that — tap the mic and speak."); }
      };
      recog.onend = () => stopMicUI();
      try { recog.start(); listening = true; micBtn.classList.add('listening'); input.placeholder = 'Listening… speak now'; input.focus(); }
      catch (err) { stopMicUI(); }
    }
    async function toggleMic() {
      if (!SR) { hint('Voice typing needs Chrome or Edge on this device.'); return; }
      if (!window.isSecureContext) { hint('Voice needs a secure page — open the app on localhost or https, not a raw IP address.'); return; }
      if (listening) { try { recog && recog.stop(); } catch (e) {} stopMicUI(); return; }
      // Ask for mic permission the reliable way (getUserMedia shows the prompt);
      // SpeechRecognition alone often throws "not-allowed" without ever asking.
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach((t) => t.stop()); // we only needed the grant
        } catch (err) {
          stopMicUI();
          const n = err && err.name;
          if (n === 'NotAllowedError' || n === 'SecurityError') {
            hint(inIframe
              ? 'Open this page in its own browser tab to use voice — the embedded preview blocks the mic.'
              : 'Mic access is blocked for this site. Click the 🔒 (or camera) icon in the address bar → set Microphone to Allow → then tap the mic again.');
          } else if (n === 'NotFoundError' || n === 'DevicesNotFoundError') {
            hint('No microphone found on this device.');
          } else {
            hint('Couldn’t reach the mic — check your browser’s microphone permissions and try again.');
          }
          return;
        }
      }
      startMic();
    }
    micBtn.addEventListener('click', toggleMic);

    // restore the saved conversation so people continue where they left off:
    // local copy renders instantly, then the server copy (visitor id) wins.
    const GREETING = "Good afternoon. I'm Toju — your consultant at Synapse. Tell me what you're looking for and I'll find verified homes that fit. No forms, no endless scrolling.";
    function render() {
      convo.innerHTML = '';
      saved.forEach((m) => { if (isDreamCtx(m)) return; (m.role === 'user' ? userMsg(m.content) : tojuMsg(m.content, Array.isArray(m.matches) ? m.matches : [])); });
      rebuildCanvas();
    }
    // scrub any hidden context that leaked into storage before the filter existed
    if (saved.some(isDreamCtx)) { saved = saved.filter((m) => !isDreamCtx(m)); persist(); }
    if (saved.length === 0) { saved = [{ role: 'assistant', content: GREETING }]; persist(); }
    render();
    // Server restore — strictly a fallback for continuing on another device.
    // Guard rails: drop hidden dream-context messages, ignore the response if
    // the visitor rotated (New chat) meanwhile, and never let a server copy
    // (which has no per-message matches) clobber an equally long local thread.
    const restoreFor = VISITOR;
    fetch(SUPABASE_URL + '/functions/v1/toju-demo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ action: 'restore', visitorId: VISITOR }),
    }).then((r) => r.json()).then((d) => {
      if (VISITOR !== restoreFor) return;
      const msgs = (Array.isArray(d.messages) ? d.messages : []).filter((m) => !isDreamCtx(m));
      if (msgs.length > saved.length) {
        saved = msgs; persist(); render(); rebuildCanvas();
      }
    }).catch(() => {});

    // deep link from a listing: ?ask=... pre-fills the composer
    const askParam = new URLSearchParams(location.search).get('ask');
    if (askParam) { input.value = askParam.slice(0, 300); input.focus(); scrollDown(); }


    // new chat — fresh visitor id, so the server thread starts clean too
    function newChat() {
      localStorage.removeItem(STORE);
      VISITOR = crypto.randomUUID(); try { localStorage.setItem(VKEY, VISITOR); } catch (e) {}
      saved = [{ role: 'assistant', content: GREETING }]; persist(); convo.innerHTML = ''; tojuMsg(GREETING);
      rebuildCanvas();
      renderSuggest(null);
    }
    const nc = document.getElementById('tjNew');
    if (nc) nc.addEventListener('click', newChat);
  </script>
</body>
</html>
