<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toju — Synapse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="motion.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* ── TRUE GLASSMORPHISM, WARM & LIGHT ──
       Frosted glass over a bright warm interior: translucent white gradient
       fills, heavy backdrop blur, a thin luminous rim, a soft top highlight.
       Off-white with a breath of terracotta — never dark. */
    .tj-orb { position: absolute; width: 56px; height: 56px; margin: -16px 0 0 -6px; opacity: .6; pointer-events: none; }
    body { background: var(--bg); }
    .tj-bg { position: fixed; inset: 0; z-index: 0;
      background: url('https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat; }
    /* whisper of a warm wash — the photo stays CLEAR; glass does the frosting */
    .tj-wash { position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(120% 80% at 78% 0%, rgba(54,54,54,0.05), transparent 58%),
        linear-gradient(180deg, rgba(245,245,245,0.2) 0%, rgba(240,240,240,0.28) 55%, rgba(235,235,235,0.42) 100%); }

    /* glass recipe, shared — light frost with a luminous rim */
    .toju .bubble, .chatbox, .pcard, .tj-hint {
      background: linear-gradient(135deg, rgba(255,255,255,0.66), rgba(255,251,246,0.38));
      backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 18px 44px rgba(122,62,22,0.13), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .appbar { background: rgba(245,245,245,0.6); backdrop-filter: blur(24px) saturate(1.5); border-bottom: 1px solid rgba(255,255,255,0.6); }

    .wrap { position: relative; z-index: 1; }
    .tj-head { padding-top: 8px; }
    .tj-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #121212; }
    .tj-title { font-family: var(--f-serif); font-weight: 500; font-size: 40px; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: center; gap: 10px; margin-top: 2px; }
    .tj-trust { font-size: 12.5px; font-weight: 500; color: var(--ink-muted); margin-top: 6px; }
    .tj-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px rgba(46,125,79,0.14); }

    .convo { display: flex; flex-direction: column; gap: 18px; padding-top: 22px; }
    .msg { display: flex; align-items: flex-end; gap: 9px; }
    .msg.user { flex-direction: row-reverse; }
    .col { max-width: 84%; display: flex; flex-direction: column; }
    .av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .av-toju { background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 6px 16px rgba(150,70,20,0.25); }
    .av-user { background: rgba(255,255,255,0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.8); color: var(--ink-muted); font-size: 13px; font-weight: 600; }
    .sender { font-size: 11.5px; font-weight: 600; color: #121212; margin: 0 0 5px 3px; }

    .bubble { padding: 13px 16px; border-radius: 20px; font-size: 14.5px; line-height: 1.55; }
    .toju .bubble { color: var(--ink); border-bottom-left-radius: 6px; }
    .user .bubble { background: #363636; color: #fff;
      border: 1px solid rgba(255,255,255,0.12); border-bottom-right-radius: 6px;
      box-shadow: 0 10px 26px rgba(20,20,20,0.22); }
    /* markdown inside a Toju bubble renders as real HTML, not raw text */
    .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 6px 0 8px; padding-left: 20px; } .bubble li { margin: 3px 0; }
    .bubble strong { font-weight: 700; } .bubble em { font-style: italic; }
    .bubble code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 5px; font-size: 0.9em; }

    .matches-h { display: flex; align-items: center; gap: 7px; margin: 12px 0 8px; }
    .matches-h .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #121212; }
    .matches-h .cnt { font-size: 11px; font-weight: 700; color: #121212; background: rgba(54,54,54,0.1); border: 1px solid rgba(54,54,54,0.2); border-radius: 9px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .matches-h .viewall { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #121212; text-decoration: none; }
    .matches-h .viewall:hover { text-decoration: underline; }
    .pcard { display: flex; gap: 13px; margin-top: 9px; padding: 11px; border-radius: 15px; cursor: pointer; transition: all .2s; color: var(--ink); }
    .pcard, .pcard * { text-decoration: none; }
    .pcard:hover { transform: translateY(-1px); border-color: rgba(54,54,54,0.45); }
    .pcard img { width: 62px; height: 62px; border-radius: 12px; object-fit: cover; }
    .pcard .pthumb { width: 62px; height: 62px; border-radius: 12px; flex: none; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; font-family: var(--f-serif);
      background: linear-gradient(135deg, #121212, #121212); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); }
    .pcard .pthumb b { font-size: 20px; line-height: 1; }
    .pcard .pthumb span { font-size: 9px; letter-spacing: .08em; opacity: .9; margin-top: 3px; }
    .pcard .price { font-family: var(--f-serif); font-weight: 600; font-size: 21px; font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; color: var(--brand); }
    .pcard .ttl { font-size: 13px; font-weight: 500; color: var(--ink); }
    .pcard .vrow { margin: 5px 0 3px; }
    .pcard .meta { font-size: 11.5px; color: var(--ink-muted); }
    .pcard .watch { font-size: 11px; color: var(--ink-muted); margin-top: 3px; }
    .pcard .watch b { color: #b0521f; font-weight: 600; }
    .pcard .trust { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--brand); }

    /* error notice — deliberately NOT a chat bubble: Toju didn't say this */
    .tj-error { display: flex; gap: 12px; align-items: flex-start; margin: 4px 0 2px;
      padding: 14px 16px; border-radius: 16px;
      background: rgba(122,39,26,0.05); border: 1px solid rgba(122,39,26,0.18); }
    .tj-error .ei { flex: none; width: 30px; height: 30px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; color: #7a271a; background: rgba(122,39,26,0.1); }
    .tj-error .ei .syn-i { width: 16px; height: 16px; }
    .tj-error .eh { font-size: 13.5px; font-weight: 700; color: #7a271a; }
    .tj-error .em { font-size: 13px; line-height: 1.55; color: var(--ink-muted); margin-top: 2px; }
    .tj-error .ew { font-size: 12px; color: var(--ink-dim); margin-top: 8px; font-style: italic; }
    .tj-error .er { margin-top: 10px; font: 600 12.5px var(--f-sans); color: #f5f5f5; background: #7a271a;
      border: none; border-radius: 100px; padding: 8px 16px; cursor: pointer; transition: opacity .2s, transform .15s; }
    .tj-error .er:hover { opacity: .88; transform: translateY(-1px); }
    .tj-error .er:active { transform: none; }

    /* "Toju remembers your search" — quiet, dismissible, only on return */
    .tj-memory { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin: 6px 0 2px; padding: 9px 13px; border-radius: 12px;
      background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.8);
      backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); }
    .tj-memory .tj-mem-k { font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: #121212; }
    .tj-memory .tj-mem-b { font-size: 12.5px; color: var(--ink-muted); min-width: 0; }
    .tj-memory .tj-mem-x { margin-left: auto; background: none; border: none; cursor: pointer;
      font-size: 17px; line-height: 1; color: var(--ink-dim); padding: 0 2px; }
    .tj-memory .tj-mem-x:hover { color: var(--ink); }

    .typing .bubble { display: flex; align-items: center; gap: 9px; }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: inline-block; animation: tjpulse 1.1s infinite; }
    .typing-dots i:nth-child(2) { animation-delay: .18s; } .typing-dots i:nth-child(3) { animation-delay: .36s; }
    @keyframes tjpulse { 0%,60%,100%{opacity:.25} 30%{opacity:1} }

    /* composer — one frosted chatbox: input on top, suggestions tucked at the bottom */
    .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 14px 22px 34px;
      display: flex; flex-direction: column; align-items: center; gap: 9px; background: none; }
    .tj-hint { width: 100%; max-width: 480px; text-align: center; font-size: 12.5px; color: var(--ink-muted); border-radius: 12px; padding: 8px 14px; }
    .chatbox { width: 100%; max-width: 480px; border-radius: 24px; padding: 6px 6px 8px;
      backdrop-filter: blur(36px) saturate(1.6); -webkit-backdrop-filter: blur(36px) saturate(1.6); }
    .pillrow { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 15px; }
    .pillrow input { flex: 1; border: none; outline: none; font-family: var(--f-sans); font-size: 14.5px; background: transparent; color: var(--ink); }
    .pillrow input::placeholder { color: rgba(21,23,26,0.45); }
    .mic, .send { width: 38px; height: 38px; border-radius: 13px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
    .mic { background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.85); color: var(--ink-muted); }
    .mic.listening { background: var(--brand); color: #fff; animation: micpulse 1.3s infinite; }
    @keyframes micpulse { 0%{ box-shadow: 0 0 0 0 rgba(54,54,54,0.5);} 70%{ box-shadow: 0 0 0 10px rgba(54,54,54,0);} 100%{ box-shadow: 0 0 0 0 rgba(54,54,54,0);} }
    .send { background: var(--brand); color: #fff; font-size: 17px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); }
    .send:disabled { opacity: .45; }
    .chatbox .suggest { display: flex; gap: 7px; padding: 9px 5px 2px; margin-top: 4px; overflow-x: auto; border-top: 1px solid rgba(255,255,255,0.6); }
    .chatbox .suggest::-webkit-scrollbar { display: none; }
    .chatbox .suggest button { white-space: nowrap; font-family: var(--f-sans); font-size: 12px; font-weight: 500; color: rgba(21,23,26,0.7); cursor: pointer;
      background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); border-radius: 100px; padding: 6px 12px; transition: all .18s; }
    .chatbox .suggest button:hover { color: var(--ink); border-color: rgba(54,54,54,0.45); background: rgba(255,255,255,0.7); }
    .convo-wrap { padding-bottom: 180px; }

    /* ── TWO-PANE CANVAS LAYOUT (chat left · listings right) ── */
    html, body { height: 100%; }
    body { overflow: hidden; }
    .tj-app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100dvh; }
    .tj-app .appbar { flex: none; }
    .tj-layout { flex: 1; display: flex; min-height: 0; }
    /* The chat opens centered, exactly like the original Toju page. The moment
       Toju surfaces matches, the page morphs into the Gemini-canvas split —
       chat 25% left, matches canvas 75% right. */
    .tj-chat { position: relative; display: flex; flex-direction: column; min-height: 0; width: 100%; max-width: 780px; margin: 0 auto; transition: max-width .35s cubic-bezier(.22,1,.36,1); }
    body.has-canvas .tj-chat { width: 25%; min-width: 280px; max-width: none; margin: 0; border-right: 1px solid rgba(255,255,255,0.55); }
    .tj-chat .tj-head { flex: none; padding: 16px 22px 4px; }
    .convo-scroll { flex: 1; overflow-y: auto; padding: 8px 22px 12px; }

    /* past-conversations drawer — sits over the chat column */
    .tj-hist { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column;
      background: rgba(245,245,245,0.92); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
      animation: histIn .25s cubic-bezier(.22,1,.36,1); }
    /* a class with display:flex outranks the [hidden] attribute — say it again.
       Without this the panel rendered open on every load regardless of the
       hidden attribute in the markup, hiding the actual chat behind it. */
    .tj-hist[hidden] { display: none; }
    @keyframes histIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce){ .tj-hist { animation: none; } }
    .tj-hist-head { flex: none; display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px 10px; font-weight: 700; font-size: 14px; }
    .tj-hist-head .syn-i { width: 15px; height: 15px; vertical-align: -2px; margin-right: 4px; }
    .tj-hist-head button { background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-muted); padding: 2px 6px; }
    .tj-hist-head button:hover { color: var(--ink); }
    .tj-hist-list { flex: 1; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 8px; }
    .hist-row { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
      background: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.9); border-radius: 12px;
      padding: 12px 14px; cursor: pointer; font: inherit; transition: transform .15s, box-shadow .15s; }
    .hist-row:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(20,26,38,0.08); }
    .hist-row .mid { flex: 1; min-width: 0; }
    .hist-row .t { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-row .d { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
    .hist-row .homes { flex: none; font-size: 11.5px; font-weight: 700; color: var(--brand-text); background: rgba(54,54,54,0.07); border-radius: 100px; padding: 4px 10px; }
    .hist-row .del { flex: none; background: none; border: none; color: var(--ink-dim); font-size: 15px; cursor: pointer; padding: 4px; }
    .hist-row .del:hover { color: #7a271a; }
    .hist-empty { text-align: center; color: var(--ink-muted); font-size: 13.5px; line-height: 1.7; padding: 40px 26px; }
    .convo-scroll::-webkit-scrollbar { width: 7px; } .convo-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }
    .convo-scroll .convo { padding-top: 8px; }
    .tj-chat .composer { position: static; flex: none; padding: 10px 16px 16px; }
    .tj-chat .chatbox, .tj-chat .tj-hint { max-width: none; }

    /* right matches canvas — a live preview of the Your-matches page.
       Hidden until Toju has something to show. */
    .tj-canvas { flex: 1; display: none; flex-direction: column; min-height: 0; }
    body.has-canvas .tj-canvas { display: flex; animation: cvIn .4s cubic-bezier(.22,1,.36,1); }
    @keyframes cvIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    .cv-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.5); }
    .cv-head .cv-t { font-family: var(--f-serif); font-weight: 500; font-size: 23px; color: var(--ink); }
    .cv-head .cv-c { font-size: 12px; font-weight: 700; color: #121212; background: rgba(54,54,54,0.1); border: 1px solid rgba(54,54,54,0.2); border-radius: 100px; padding: 2px 10px; }
    .cv-head .cv-all { margin-left: auto; font-size: 12.5px; font-weight: 600; color: #121212; text-decoration: none; }
    .cv-head .cv-all:hover { text-decoration: underline; }
    .cv-body { flex: 1; overflow-y: auto; padding: 22px 24px 40px; }
    .cv-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--ink-muted); gap: 10px; padding: 40px; }
    .cv-empty .em-orb { width: 66px; height: 66px; opacity: .8; }
    .cv-empty p { font-size: 14.5px; max-width: 330px; line-height: 1.65; }
    /* ── EXACT Your-matches page card + map styles (browse.html parity).
       Class names and rules match browse.html so the canvas IS a live
       preview of that page. Keep the two files in sync. ── */
    #cvMap { height: 230px; border-radius: var(--radius); margin-bottom: 16px; position: relative; z-index: 1;
      border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 18px 44px rgba(122,62,22,0.13); }
    .chip-unv { background: rgba(0,0,0,0.05); color: var(--ink-muted); border: 1px solid rgba(0,0,0,0.12); }
    .chip-prog { background: rgba(176,125,43,0.1); color: #a8742b; border: 1px solid rgba(176,125,43,0.28); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
    .listing { display: flex; flex-direction: column; overflow: hidden; cursor: pointer; position: relative;
      transition: opacity var(--m-expanded) var(--m-ease), transform var(--m-expanded) var(--m-ease), box-shadow .25s, border-color .25s; }
    .listing:hover { transform: translateY(-4px); box-shadow: 0 26px 56px rgba(122,62,22,0.16), inset 0 1px 0 rgba(255,255,255,0.9); border-color: rgba(54,54,54,0.4); }
    .listing .body { padding: 18px 18px 14px; }
    .listing .tags { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
    .listing .match { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: #121212; background: rgba(54,54,54,0.1); border: 1px solid rgba(54,54,54,0.22); padding: 3px 9px; border-radius: 100px; }
    .listing .expiry { font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
      color: #8a4a12; background: rgba(199,106,26,0.10); border: 1px solid rgba(199,106,26,0.28);
      padding: 3px 9px; border-radius: 100px; white-space: nowrap; }
    .listing .price { font-family: var(--f-serif); font-weight: 600; font-size: 27px; font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; color: var(--brand); }
    .listing .ttl { font-size: 14.5px; font-weight: 500; margin-top: 2px; }
    .listing .loc { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
    .listing .why { font-size: 12.5px; line-height: 1.55; color: var(--ink-muted); margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.7); }
    .listing .why b { color: #b0521f; font-weight: 600; }
    .listing .score { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 12px; color: var(--ink-muted); }
    .listing .ring { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--success); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--ink); }
    .listing .score.unv { color: var(--ink-dim); }
    .listing .ring.unv { border-color: rgba(0,0,0,0.22); color: var(--ink-dim); font-size: 12px; }
    .listing .img { position: relative; height: 170px; margin: 0 10px 10px; border-radius: 15px; overflow: hidden; }
    .listing .img img { width: 100%; height: 100%; object-fit: cover; }
    .listing .save { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.75);
      display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; transition: transform var(--m-micro) var(--m-ease); }
    .listing .save.on { color: #121212; background: rgba(255,255,255,0.85); }
    .listing .save:active { transform: scale(0.85); }


    /* desktop shows the canvas (hide inline chat cards); mobile keeps inline cards, hides canvas */
    @media (min-width: 900px) { .tj-chat .matches-h, .tj-chat .pcard { display: none; } }

    /* the mobile chrome never exists above the phone breakpoint */
    .tjm-bar, .tjm-matches { display: none; }

    /* tablet: unstack, keep the page-scrolling behaviour */

    /* ══ MOBILE (≤720px) — a chat app, not a scrolling web page ══════════
       The page itself must NOT scroll: the bar stays put, the composer stays
       docked above the keyboard, and only the transcript moves. A sticky
       composer inside a scrolling page (the old behaviour) drifts as the iOS
       URL bar shows and hides, which on a chat reads as the input running
       away from your thumb. 100dvh + a single internal scroller fixes it. */
    @media (max-width: 1024px) {
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

      /* ── cross-page nav ────────────────────────────────────────────────
         Hiding .appbar wholesale took the only links to the other consumer
         pages with it, so Toju, Your matches and Dream Home became mutually
         unreachable on a phone. Rather than hand-writing a second copy of
         those links (which would drift), the appbar stays in the layout with
         everything except its <nav> stripped out, and the nav becomes a
         compact row. Same hrefs, same .active state, one source of truth. */
      .appbar { display: flex !important; padding: 0 12px; min-height: 0;
        border-bottom: 1px solid var(--border); background: rgba(245,245,245,0.9);
        backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); }
      .appbar > *:not(nav) { display: none !important; }

  <script>
    const SUPABASE_URL = 'https://bhrhejpekmhbhwryjhgk.supabase.co';
    const ANON_KEY = 'sb_publishable_D25gO3eui5oI4L3h7bx-vg_fCHbo3LV';

    const convo = document.getElementById('convo');
    const input = document.getElementById('tjInput');
    const sendBtn = document.getElementById('tjSend');
    let busy = false;
    const STORE = 'toju_chat_v1';
    // stable anonymous visitor id -> server-side memory (continue anywhere this id exists)
    const VKEY = 'toju_visitor_v1';
    let VISITOR = localStorage.getItem(VKEY);
    if (!VISITOR) { VISITOR = crypto.randomUUID(); try { localStorage.setItem(VKEY, VISITOR); } catch (e) {} }
    const loadSaved = () => { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { return []; } };
    const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} };
    let saved = loadSaved();

    // shared with browse.html — see matches-shared.js + docs/STATE_CONTRACT.md
    const { esc, naira } = window.SynMatches;
    const convoScroll = document.querySelector('.convo-scroll');
    const scrollDown = () => {
      // scroll the chat pane on desktop; the window on mobile (canvas hidden)
      if (convoScroll && convoScroll.clientHeight < convoScroll.scrollHeight && getComputedStyle(convoScroll).overflowY !== 'visible') {
        convoScroll.scrollTo({ top: convoScroll.scrollHeight, behavior: 'smooth' });
      } else {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    };

    /* ── right-side MATCHES CANVAS — a live preview of the Your-matches page.
       Cards, map and layout mirror browse.html EXACTLY (keep in sync with that
       page). No toolbar: whatever the user wants changed, they tell Toju. The
       page opens as a centered chat and morphs to 25/75 when matches land. ── */
    const cvGrid = document.getElementById('cvGrid');
    const cvCount = document.getElementById('cvCount');
    let canvasMatches = [];
    const cvKeys = new Set();
    const keyOf = (m) => (m.title || '') + '|' + (m.price || '');
    function collect(matches) {
      if (!Array.isArray(matches)) return;
      matches.forEach((m) => { const k = keyOf(m); if (!cvKeys.has(k)) { cvKeys.add(k); canvasMatches.unshift(m); } });
    }

    // browse.html parity: shaper, card markup and map all come from
    // matches-shared.js — the canvas renders the SAME card browse.html does
    // (compare checkboxes are a browse-only tool; here you just tell Toju).
    let cvSaves = SynMatches.readSaves();
    SynMatches.onSavesChanged(function (s) { cvSaves = s; renderCanvas(); });
    const cvMapState = {}; // persistent {map, layer} for SynMatches.drawMatchMap

    function renderCanvas() {
      const items = canvasMatches.map(SynMatches.shapeTojuMatch);
      cvCount.textContent = items.length;
      // the mobile strip mirrors the same count (the canvas is desktop-only)
      var tjmCount = document.getElementById('tjmCount');
      if (tjmCount) tjmCount.textContent = items.length;
      document.body.classList.toggle('has-canvas', items.length > 0);
      if (items.length === 0) { cvGrid.innerHTML = ''; return; }
      cvGrid.innerHTML = items.map((l, i) => SynMatches.listingCardHtml(l, i, { saves: cvSaves })).join('');
      SynMatches.drawMatchMap(cvMapState, 'cvMap', items);
      if (window.synMotion) synMotion.refresh();
    }
    cvGrid.addEventListener('click', (e) => {
      const sv = e.target.closest('[data-save]');
      if (sv) {
        const id = sv.getAttribute('data-save');
        cvSaves = SynMatches.toggleSave(id);   // re-reads storage; no lost updates
        renderCanvas(); return;
      }
      const card = e.target.closest('.listing');
      if (card) window.location.href = SynMatches.propertyHref(card.getAttribute('data-id'));
    });
    function rebuildCanvas() {
      canvasMatches = []; cvKeys.clear();
      saved.forEach((m) => { if (m.role === 'assistant') collect(m.matches); });
      renderCanvas();
    }


    function matchesHtml(matches) {
      if (!Array.isArray(matches) || matches.length === 0) return '';
      const cards = matches.map((m) => {
        const why = m.why ? '<div class="watch reason"><b>Recommended —</b> ' + esc(m.why) + '</div>' : '';
        const room = m.room ? '<div class="watch">' +
          (m.room.totalRooms - m.room.housematesIn) + ' of ' + m.room.totalRooms + ' rooms free · ' +
          (m.room.genderPreference === 'any' ? 'any gender' : m.room.genderPreference + '-only') +
          (m.room.ensuite ? ' · ensuite' : '') + (m.room.billsIncluded ? ' · bills incl.' : '') +
          (m.room.vibe ? ' · ' + esc(m.room.vibe) : '') + '</div>' : '';
        const watch = m.whatToWatch && m.whatToWatch !== 'No major synthetic flags'
          ? '<div class="watch"><b>Worth checking —</b> ' + esc(m.whatToWatch) + '</div>' : '';
        const yld = (m.yieldPct != null && m.yieldPct > 0) ? ' · ' + m.yieldPct + '% yield' : '';
        return '<a class="pcard" href="' + SynMatches.propertyHref(m.id) + '">'
          + '<div class="pthumb"><b>' + (Number(m.bedrooms) || 0) + '</b><span>BED</span></div>'
          + '<div><div class="price">' + naira(m.price) + (m.listingType === 'rent' ? '<span style="font-size:12px;color:var(--ink-muted)">/yr</span>' : '') + '</div>'
          + '<div class="ttl">' + esc(m.title || '') + '</div>'
          // Verification state sits on every card. Toju shows checked and
          // unchecked homes alike, so the label is what keeps that honest.
          + '<div class="vrow">' + SynMatches.verifyChip(m.verificationStatus || (m.verified ? 'verified' : 'unverified')) + '</div>'
          + '<div class="meta"><span class="trust" title="Property Confidence — how much of our verification this home has passed">✦ Confidence ' + (Number(m.trustScore) || 0) + '</span> · '
          + esc(m.city || '') + yld + '</div>'
          + room + why + watch + '</div></a>';
      }).join('');
      return '<div class="matches-h"><span style="color:var(--brand)">✦</span><span class="lbl">HOMES WORTH A LOOK</span>'
        + '<span class="cnt">' + matches.length + '</span>'
        + '<a class="viewall" href="browse.html">View all →</a></div>' + cards;
    }

    // tiny, safe markdown → HTML (escape first, then bold/italic/code/lists/paras)
    function md(t) {
      let s = esc(String(t == null ? '' : t));
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      const lines = s.split(/\n/);
      let html = '', inUl = false, inOl = false;
      const close = () => { if (inUl) { html += '</ul>'; inUl = false; } if (inOl) { html += '</ol>'; inOl = false; } };
      lines.forEach((line) => {
        const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
        if (ul) { if (!inUl) { close(); html += '<ul>'; inUl = true; } html += '<li>' + ul[1] + '</li>'; }
        else if (ol) { if (!inOl) { close(); html += '<ol>'; inOl = true; } html += '<li>' + ol[1] + '</li>'; }
        else { close(); if (line.trim()) html += '<p>' + line + '</p>'; }
      });
      close();
      return html || '<p>' + s + '</p>';
    }
    function tojuMsg(text, matches) {
      const el = document.createElement('div');
      el.className = 'msg toju m-enter';
      el.innerHTML = '<div class="av av-toju">✦</div><div class="col"><div class="sender">Toju</div><div class="bubble">' + md(text) + '</div>' + matchesHtml(matches) + '</div>';
      convo.appendChild(el); scrollDown();
    }
    function userMsg(text) {
      const el = document.createElement('div');
      el.className = 'msg user m-enter';
      el.innerHTML = '<div class="col"><div class="bubble">' + esc(text) + '</div></div><div class="av av-user">A</div>';
      convo.appendChild(el); scrollDown();
    }
    /* Staged waiting narration. A two-pass grounded answer takes real seconds,
       and an undifferentiated "thinking…" makes every one of them feel like a
       hang. These say what is actually happening, in Toju's voice, at the two
       moments a person starts to doubt the page.

       The wording is the doctrine's, not invented here, and it is deliberately
       non-specific about counts — Toju never claims to be "checking 214
       listings" unless it is. Cleared by remove(), so a fast reply never shows
       a stage at all. */
    const TYPING_STAGES = [
      { at: 2500, text: 'Checking this against our verified listings…' },
      { at: 6000, text: 'Still with you — I’d rather get this right than fast.' },
    ];

    function typing() {
      const el = document.createElement('div');
      el.className = 'msg toju typing m-enter';
      el.innerHTML = '<div class="av av-toju">✦</div><div class="col"><div class="sender">Toju</div>'
        + '<div class="bubble"><span data-lottie="toju-typing" style="width:48px;height:20px"></span>'
        + '<span class="tj-stage" style="color:var(--ink-muted);font-style:italic">thinking…</span></div></div>';
      convo.appendChild(el);
      if (window.synMotion) synMotion.mount(el.querySelector('[data-lottie]'));

      // aria-live so a screen-reader user hears the wait explained too, rather
      // than silence followed by a wall of text.
      const stage = el.querySelector('.tj-stage');
      stage.setAttribute('aria-live', 'polite');
      const timers = TYPING_STAGES.map((s) => setTimeout(() => {
        stage.textContent = s.text;
        scrollDown();
      }, s.at));

      // Callers do `t.remove()`; override it so the timers cannot fire into a
      // detached node after the answer has already arrived.
      const nativeRemove = el.remove.bind(el);
      el.remove = () => { timers.forEach(clearTimeout); nativeRemove(); };

      scrollDown(); return el;
    }

    // ── Dream Home board → Toju's knowledge ──
    // Toju reads the visitor's mood board (title, vibe chips, pinned image
    // captions) and folds it into every conversation as silent context. The
    // message is sent to the model but never rendered in the chat.
    const DREAM_CTX_PREFIX = '[Background from my Dream Home mood board';
    // The dream context is sent to the model but must never surface in the UI:
    // the server persists it, so restored threads carry it — filter everywhere.
    const isDreamCtx = (m) => m && m.role === 'user' && typeof m.content === 'string' && m.content.startsWith(DREAM_CTX_PREFIX);
    function dreamContext() {
      try {
        const b = JSON.parse(localStorage.getItem('synapse_moodboard_v1'));
        if (!b) return null;
        const clean = (a) => Array.isArray(a) ? [...new Set(a.filter(Boolean))] : [];
        const vibes = clean(b.vibe);
        // categorised signals (new boards). Fall back to raw captions for older boards.
        const areas = clean(b.areas);
        const housing = clean(b.housing);
        const lifestyle = clean(b.lifestyle);
        const aesthetic = clean(b.aesthetic);
        const caps = clean(Array.isArray(b.images) ? b.images.map((i) => i && i.c) : []);
        const hasCat = areas.length || housing.length || lifestyle.length || aesthetic.length;
        if (!vibes.length && !caps.length && !hasCat) return null;
        let s = '[Background from my Dream Home ' + (b.mode || 'dream') + ' board, use it to shape what you recommend without repeating it back: ';
        s += 'board "' + (b.name || 'My dream home') + '"';
        if (vibes.length) s += ' · the vibe I love: ' + vibes.join(', ');
        if (housing.length) s += ' · home types I want: ' + housing.join(', ');
        if (areas.length) s += ' · neighbourhoods/settings that feel right: ' + areas.join(', ');
        if (lifestyle.length) s += ' · lifestyle I want: ' + lifestyle.join(', ');
        if (aesthetic.length) s += ' · interior aesthetic: ' + aesthetic.join(', ');
        if (!hasCat && caps.length) s += ' · spaces I keep pinning: ' + caps.join(', ');
        return s + '. Weight neighbourhood and home-type signals for what you surface; treat aesthetic/vibe as tone, not a hard filter.]';
      } catch (e) { return null; }
    }

    /* If reply is still the model's JSON envelope, lift its fields up onto
       the response object in place. Mutates `data` so every downstream reader
       (reply, matches, suggestions) sees the unwrapped values. Tolerates a
       ```json fence, and leaves anything it cannot parse untouched. */
    function unwrapEnvelope(data) {
      if (typeof data.reply !== 'string') return;
      let raw = data.reply.trim();
      if (!raw.startsWith('{') && !raw.startsWith('```')) return;
      raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
      if (!raw.startsWith('{')) return;
      let inner;
      try {
        inner = JSON.parse(raw);
      } catch (e) {
        /* Envelopes arrive truncated or with a malformed tail often enough
           that a strict parse is not sufficient — that is exactly the case
           that was leaking JSON to the screen. Salvage just the reply string,
           which is the only part the reader actually needs. */
        const m = raw.match(/"reply"\s*:\s*"((?:[^"\\]|\\.)*)"/);
        if (m) {
          try { data.reply = JSON.parse('"' + m[1] + '"'); } catch (e2) { /* leave as-is */ }
        }
        return;
      }
      if (!inner || typeof inner.reply !== 'string') return;
      data.reply = inner.reply;
      if (!Array.isArray(data.matches) || !data.matches.length) {
        if (Array.isArray(inner.matches)) data.matches = inner.matches;
      }
      if (!Array.isArray(data.suggestions) || !data.suggestions.length) {
        if (Array.isArray(inner.suggestions)) data.suggestions = inner.suggestions;
      }
    }

    async function ask() {
      clearError();
      const t = typing();
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort('timeout'), 25000);
      try {
        if (!navigator.onLine) throw Object.assign(new Error('offline'), { kind: 'offline' });
        const outgoing = saved.slice(-14).map((m) => ({ role: m.role, content: m.content }));
        const dream = dreamContext();
        if (dream) outgoing.unshift({ role: 'user', content: dream });
        const res = await fetch(SUPABASE_URL + '/functions/v1/toju-demo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
          body: JSON.stringify({ visitorId: VISITOR, messages: outgoing }),
          signal: ctrl.signal,
        });
        const data = await res.json().catch(() => ({}));
        clearTimeout(timer); t.remove();
        if (!res.ok) throw Object.assign(new Error('http ' + res.status), { kind: res.status === 429 ? 'busy' : 'server' });
        if (data.error || !data.reply) throw Object.assign(new Error('empty reply'), { kind: 'server' });
        /* Guard: the function normally parses the model's JSON envelope and
           returns its fields at the top level, but when that parse fails it
           passes the raw text straight through — and the user gets a screenful
           of {"reply": …} on the main product surface. Seen intermittently in
           testing. Unwrap it here so a server-side parse miss can never surface
           as raw JSON; the real fix belongs in the toju-demo function. */
        unwrapEnvelope(data);
        // show the canvas whenever the function returns matches (not only when it
        // sets showMatches) so asking "show me what you found" always renders them.
        const matches = Array.isArray(data.matches) ? data.matches : [];
        saved.push({ role: 'assistant', content: data.reply, matches });
        persist();
        tojuMsg(data.reply, matches);
        collect(matches); renderCanvas();
        renderSuggest(data.suggestions);
      } catch (e) {
        clearTimeout(timer); t.remove();
        const kind = e && e.kind ? e.kind
          : (e && e.name === 'AbortError') ? 'timeout'
          : !navigator.onLine ? 'offline' : 'network';
        showError(kind);
      }
      busy = false; scrollDown();
    }

    /* ── error states ──────────────────────────────────────────────────────
       An error is NOT a Toju message: it never enters the saved thread and
       never speaks in Toju's voice (he didn't say it — the connection failed).
       It's a system notice that names the real cause, says what happens to the
       user's question, and offers the one action that fixes it. */
    const ERRORS = {
      offline:  { icon: 'unverified', ttl: "You're offline",
                  msg: 'Your question is saved. I’ll answer as soon as you’re back online.', auto: true },
      timeout:  { icon: 'pending', ttl: 'That took too long',
                  msg: 'The connection is slow right now. Your question is still here — try again?' },
      busy:     { icon: 'pending', ttl: 'A lot of people are asking at once',
                  msg: 'Give it a few seconds and try again — your question is saved.' },
      server:   { icon: 'unverified', ttl: 'I couldn’t reach my advisor service',
                  msg: 'This is on our side, not yours. Your question is saved — try again in a moment.' },
      network:  { icon: 'unverified', ttl: 'Couldn’t connect',
                  msg: 'Check your connection and try again — your question is saved.' },
    };
    let errEl = null;
    function clearError() { if (errEl) { errEl.remove(); errEl = null; } }
    function showError(kind) {
      const e = ERRORS[kind] || ERRORS.network;
      const ic = (window.SynIcons && SynIcons.has(e.icon)) ? SynIcons.svg(e.icon) : '!';
      errEl = document.createElement('div');
      errEl.className = 'tj-error m-enter';
      errEl.setAttribute('role', 'alert');
      errEl.innerHTML = '<div class="ei">' + ic + '</div><div class="et">'
        + '<div class="eh">' + esc(e.ttl) + '</div><div class="em">' + esc(e.msg) + '</div>'
        + (e.auto ? '<div class="ew">Waiting for your connection…</div>'
                  : '<button class="er" type="button">Try again</button>')
        + '</div>';
      const btn = errEl.querySelector('.er');
      if (btn) btn.addEventListener('click', retry);
      convo.appendChild(errEl); scrollDown();
    }
    function retry() {
      if (busy) return;
      clearError();
      busy = true;
      ask();   // the user's message is already in `saved` — just re-ask
    }
    // came back online with a question still unanswered → answer it, no tap needed
    window.addEventListener('online', () => {
      const last = saved[saved.length - 1];
      if (errEl && last && last.role === 'user') retry();
      else clearError();
    });
    window.addEventListener('offline', () => { if (!busy) { clearError(); showError('offline'); } });

    function send(text) {
      const v = (text != null ? text : input.value).trim();
      if (!v || busy) return;
      busy = true; input.value = '';
      saved.push({ role: 'user', content: v });
      persist();
      userMsg(v);
      ask();
    }

    // suggestions are DYNAMIC — Toju sends tap-to-answer options for the
    // question it just asked ("Married with kids", "Just me", …)
    const suggestEl = document.getElementById('tjSuggest');
    const DEFAULT_SUGGEST = suggestEl.innerHTML;
    function renderSuggest(list) {
      if (Array.isArray(list) && list.length) {
        suggestEl.innerHTML = list.map((s) =>
          '<button data-send="' + esc(s) + '">' + esc(s) + '</button>').join('');
      } else {
        suggestEl.innerHTML = DEFAULT_SUGGEST;
      }
    }
    suggestEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-send]'); if (b) send(b.getAttribute('data-send'));
    });
    sendBtn.addEventListener('click', () => send());
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });

    /* ───────── voice typing (Web Speech API) ───────── */
    const micBtn = document.getElementById('tjMic');
    const hintEl = document.getElementById('tjHint');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const inIframe = window.self !== window.top;
    let recog = null, listening = false, hintTimer = null;

    function hint(msg) {
      hintEl.textContent = msg; hintEl.hidden = false;
      clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintEl.hidden = true; }, 5000);
    }
    function stopMicUI() { listening = false; micBtn.classList.remove('listening'); input.placeholder = "Tell Toju what you're looking for…"; }
    function startMic() {
      recog = new SR();
      // en-NG is rejected by many Chrome builds ("language-not-supported"); en-US
      // is universally supported and handles Nigerian-accented English fine.
      try { recog.lang = (navigator.language && /^en/i.test(navigator.language)) ? navigator.language : 'en-US'; } catch (e) { recog.lang = 'en-US'; }
      recog.interimResults = true; recog.continuous = true;
      const base = input.value.trim() ? input.value.trim() + ' ' : '';
      recog.onresult = (e) => {
        let txt = '';
        for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
        input.value = base + txt;
      };
      // exhaustive: no error path is silent (the old code dropped every case but 3)
      recog.onerror = (e) => {
        stopMicUI();
        switch (e.error) {
          case 'not-allowed': case 'service-not-allowed':
            hint(inIframe
              ? 'Open this page in its own browser tab to use voice — it’s blocked inside the embedded preview.'
              : 'Microphone is blocked. Click the 🔒 icon in the address bar → Allow, then tap the mic again.'); break;
          case 'no-speech': hint('Didn’t catch that — tap the mic and speak.'); break;
          case 'audio-capture': hint('No microphone found — check it’s connected, then try again.'); break;
          case 'network': hint('Voice needs a connection — check your network and try again.'); break;
          case 'aborted': break; // user stopped it — no message needed
          case 'language-not-supported':
            if (recog.lang !== 'en-US') { recog.lang = 'en-US'; try { recog.start(); listening = true; micBtn.classList.add('listening'); return; } catch (e2) {} }
            hint('Voice isn’t available in your browser here — try Chrome or Edge.'); break;
          default: hint('Voice hit a snag — tap the mic to try again.');
        }
      };
      recog.onend = () => stopMicUI();
      try { recog.start(); listening = true; micBtn.classList.add('listening'); input.placeholder = 'Listening… speak now'; input.focus(); }
      catch (err) { stopMicUI(); hint('Couldn’t start voice — tap the mic to try again.'); }
    }
    async function toggleMic() {
      if (!SR) { hint('Voice typing needs Chrome or Edge on this device.'); return; }
      if (!window.isSecureContext) { hint('Voice needs a secure page — open the app on localhost or https, not a raw IP address.'); return; }
      if (listening) { try { recog && recog.stop(); } catch (e) {} stopMicUI(); return; }
      // Ask for mic permission the reliable way (getUserMedia shows the prompt);
      // SpeechRecognition alone often throws "not-allowed" without ever asking.
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach((t) => t.stop()); // we only needed the grant
        } catch (err) {
          stopMicUI();
          const n = err && err.name;
          if (n === 'NotAllowedError' || n === 'SecurityError') {
            hint(inIframe
              ? 'Open this page in its own browser tab to use voice — the embedded preview blocks the mic.'
              : 'Mic access is blocked for this site. Click the 🔒 (or camera) icon in the address bar → set Microphone to Allow → then tap the mic again.');
          } else if (n === 'NotFoundError' || n === 'DevicesNotFoundError') {
            hint('No microphone found on this device.');
          } else {
            hint('Couldn’t reach the mic — check your browser’s microphone permissions and try again.');
          }
          return;
        }
      }
      startMic();
    }
    micBtn.addEventListener('click', toggleMic);

    // restore the saved conversation so people continue where they left off:
    // local copy renders instantly, then the server copy (visitor id) wins.
    /* First-visit greeting. Mirrors FIRST_VISIT_GREETING in the toju-demo edge
       function — see the placeholder contract documented above that constant.
       `{{LISTING_COUNT}}` sits immediately before "the homes" so the substituted
       value carries its own trailing text; an unknown count degrades to "the
       homes agencies have listed with us", which still reads correctly.

       Never hardcode a number here: a stale count is a trust bug. The count
       arrives with the restore response and the greeting is rewritten in place.

       It deliberately does not promise everything is verified — Toju shows both
       and says which is which. The old copy ("verified homes that fit", with a
       hardcoded "Good afternoon" that was wrong most of the day) promised the
       opposite of what Toju now does. */
    const GREETING_TEMPLATE =
      "I'm Toju — your consultant at Synapse. I work from {{LISTING_COUNT}}the homes agencies have listed with us: "
      + "I can narrow them to what genuinely fits you, tell you what an area is really like to live in, and connect you to the agency when you're ready.\n\n"
      + "Some of those homes have passed our seven checks and some haven't yet — I'll tell you which is which every time, and you decide what you're comfortable with. "
      + "I can't look outside Synapse, and I won't pass your details to anyone until you choose to. So, tell me what's prompting the move.";
    const greetingWith = (n) =>
      GREETING_TEMPLATE.replace('{{LISTING_COUNT}}', Number.isFinite(n) && n > 0 ? n.toLocaleString() + ' of ' : '');
    const GREETING = greetingWith(null);
    function render() {
      convo.innerHTML = '';
      saved.forEach((m) => { if (isDreamCtx(m)) return; (m.role === 'user' ? userMsg(m.content) : tojuMsg(m.content, Array.isArray(m.matches) ? m.matches : [])); });
      rebuildCanvas();
    }
    // scrub any hidden context that leaked into storage before the filter existed
    if (saved.some(isDreamCtx)) { saved = saved.filter((m) => !isDreamCtx(m)); persist(); }
    if (saved.length === 0) { saved = [{ role: 'assistant', content: GREETING }]; persist(); }
    render();
    // Server restore — strictly a fallback for continuing on another device.
    // Guard rails: drop hidden dream-context messages, ignore the response if
    // the visitor rotated (New chat) meanwhile, and never let a server copy
    // (which has no per-message matches) clobber an equally long local thread.
    const restoreFor = VISITOR;
    fetch(SUPABASE_URL + '/functions/v1/toju-demo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ action: 'restore', visitorId: VISITOR }),
    }).then((r) => r.json()).then((d) => {
      if (VISITOR !== restoreFor) return;
      const msgs = (Array.isArray(d.messages) ? d.messages : []).filter((m) => !isDreamCtx(m));
      if (msgs.length > saved.length) {
        saved = msgs; persist(); render(); rebuildCanvas();
      }

      // Live inventory count → the greeting's placeholder. Only rewrites the
      // greeting while it is still the ONLY thing said; once a conversation has
      // started, editing Toju's first line under the user would be dishonest.
      if (Number.isFinite(d.listingCount) && saved.length === 1 && saved[0].role === 'assistant') {
        saved[0].content = greetingWith(d.listingCount);
        persist(); render();
      }

      // Item 3 — make the memory visible. Toju already remembered; nothing said
      // so, which is the whole point of the feature: the reason to come back
      // here instead of scrolling Instagram again is that it kept your thread.
      showMemoryNote(d.criteria, msgs);
    }).catch(() => {});

    /* A quiet line above the conversation on return, stating what Toju actually
       still holds. Rendered ONLY from real restored state — the brief the user
       themselves gave — never a generic "welcome back". If there is no brief and
       no prior exchange, nothing appears. */
    function showMemoryNote(criteria, msgs) {
      const hasThread = Array.isArray(msgs) && msgs.some((m) => m.role === 'user');
      const brief = criteria && typeof criteria.brief === 'string' ? criteria.brief.trim() : '';
      if (!hasThread && !brief) return;
      if (document.getElementById('tjMemory')) return;

      const el = document.createElement('div');
      el.id = 'tjMemory';
      el.className = 'tj-memory';
      el.innerHTML = '<span class="tj-mem-k">Toju remembers your search</span>'
        + (brief ? '<span class="tj-mem-b">' + esc(brief) + '</span>' : '')
        + '<button type="button" class="tj-mem-x" aria-label="Dismiss">×</button>';
      convo.parentNode.insertBefore(el, convo);
      el.querySelector('.tj-mem-x').addEventListener('click', () => el.remove());
    }

    // deep link from a listing: ?ask=... pre-fills the composer
    /* Deep link from a listing or the landing hero: ?ask=…
       It used to only pre-fill the composer, leaving the visitor to press send
       on their own words — a pointless second step. It now sends, so someone who
       typed their brief on the landing page lands mid-conversation rather than
       staring at their own sentence. The URL is cleaned afterwards so a reload
       doesn't re-ask the same thing. */
    const askParam = new URLSearchParams(location.search).get('ask');
    if (askParam) {
      const q = askParam.slice(0, 300).trim();
      input.value = q;
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      if (q) { setTimeout(() => send(), 60); } else { input.focus(); scrollDown(); }
    }


    /* ── chat history: every conversation is kept, with the homes it surfaced.
       A session archives on "New chat" (or when you open an older one) and can
       be picked back up: its visitorId comes back too, so Toju's server-side
       memory continues where that conversation left off. ── */
    const SESS = 'toju_sessions_v1';
    const loadSessions = () => { try { return JSON.parse(localStorage.getItem(SESS)) || []; } catch (e) { return []; } };
    const saveSessions = (s) => { try { localStorage.setItem(SESS, JSON.stringify(s.slice(0, 30))); } catch (e) {} };
    function archiveCurrent() {
      if (!saved.some((m) => m.role === 'user')) return; // nothing worth keeping
      const first = saved.find((m) => m.role === 'user');
      const sessions = loadSessions().filter((s) => s.visitorId !== VISITOR);
      sessions.unshift({
        id: crypto.randomUUID(), visitorId: VISITOR, endedAt: Date.now(),
        title: String(first.content).slice(0, 80),
        homes: saved.reduce((n, m) => n + (Array.isArray(m.matches) ? m.matches.length : 0), 0),
        messages: saved,
      });
      saveSessions(sessions);
    }

    const histPanel = document.getElementById('tjHistPanel');
    const histList = document.getElementById('tjHistList');
    function histDate(ts) {
      const d = new Date(ts), now = new Date();
      const days = Math.floor((now - d) / 864e5);
      const when = days === 0 ? 'Today' : days === 1 ? 'Yesterday'
        : d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
      return when + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }
    function renderHist() {
      const sessions = loadSessions();
      if (!sessions.length) {
        histList.innerHTML = '<div class="hist-empty">No past conversations yet.<br>When you start a new chat, the old one is saved here — with every home Toju recommended.</div>';
        return;
      }
      histList.innerHTML = sessions.map((s) => {
        const n = (s.messages || []).filter((m) => m.role === 'user').length;
        return '<button class="hist-row" data-open="' + s.id + '">'
          + '<div class="mid"><div class="t">' + esc(s.title || 'Conversation') + '</div>'
          + '<div class="d">' + histDate(s.endedAt) + ' · ' + n + ' message' + (n === 1 ? '' : 's') + '</div></div>'
          + (s.homes ? '<span class="homes">' + s.homes + ' home' + (s.homes === 1 ? '' : 's') + '</span>' : '')
          + '<span class="del" data-del="' + s.id + '" role="button" aria-label="Delete conversation" title="Delete">🗑</span>'
          + '</button>';
      }).join('');
    }
    function openHist() { renderHist(); histPanel.hidden = false; }
    function closeHist() { histPanel.hidden = true; }
    document.getElementById('tjHist').addEventListener('click', () => histPanel.hidden ? openHist() : closeHist());
    document.getElementById('tjHistClose').addEventListener('click', closeHist);
    histList.addEventListener('click', (e) => {
      const del = e.target.closest('[data-del]');
      if (del) { e.stopPropagation(); saveSessions(loadSessions().filter((s) => s.id !== del.dataset.del)); renderHist(); return; }
      const row = e.target.closest('[data-open]');
      if (!row) return;
      const s = loadSessions().find((x) => x.id === row.dataset.open);
      if (!s) return;
      archiveCurrent();                                           // keep today's thread
      saveSessions(loadSessions().filter((x) => x.id !== s.id));  // it's live again
      VISITOR = s.visitorId || crypto.randomUUID();
      try { localStorage.setItem(VKEY, VISITOR); } catch (e2) {}
      saved = Array.isArray(s.messages) ? s.messages : [];
      if (!saved.length) saved = [{ role: 'assistant', content: GREETING }];
      persist(); render(); closeHist();
    });

    // new chat — archive the old thread, then a fresh visitor id so the
    // server thread starts clean too
    function newChat() {
      archiveCurrent();
      localStorage.removeItem(STORE);
      VISITOR = crypto.randomUUID(); try { localStorage.setItem(VKEY, VISITOR); } catch (e) {}
      saved = [{ role: 'assistant', content: GREETING }]; persist(); convo.innerHTML = ''; tojuMsg(GREETING);
      rebuildCanvas();
      renderSuggest(null);
    }
    const nc = document.getElementById('tjNew');
    if (nc) nc.addEventListener('click', newChat);

    /* Mobile bar: forwards to the real controls rather than owning its own
       copy of the logic, so history and new-chat can never drift apart
       between the two layouts. */
    (function () {
      var mh = document.getElementById('tjmHist');
      var mn = document.getElementById('tjmNew');
      if (mh) mh.addEventListener('click', function () {
        histPanel.hidden ? openHist() : closeHist();
      });
      if (mn) mn.addEventListener('click', newChat);
    })();
  </script>
</body>
</html>
