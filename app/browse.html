<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your matches — Synapse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="motion.css" />
  <style>
    /* This page is not a catalogue. It only shows the homes Toju picked for
       this person's brief — you arrive here from "View all →" in the chat. */
    /* same warm scene as the Toju chat, kept clear — the frosted cards
       refract it, which is what makes the glassmorphism real */
    body { background: #f7efe7; }
    .bg-scene { position: fixed; inset: 0; z-index: 0;
      background: url('https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat; }
    .bg-wash { position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(120% 80% at 78% 0%, rgba(212,110,60,0.14), transparent 58%),
        linear-gradient(180deg, rgba(250,242,234,0.3) 0%, rgba(248,238,228,0.4) 55%, rgba(244,230,216,0.55) 100%); }
    .wrap { position: relative; z-index: 1; }
    .appbar { background: rgba(250,245,239,0.55); backdrop-filter: blur(24px) saturate(1.5); border-bottom: 1px solid rgba(255,255,255,0.6); }
    /* stronger frost so text stays readable over the photo */
    .card { background: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(255,251,246,0.46));
      backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); }
    .brief { display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin: 18px 0 22px; }
    .brief .orb { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); }
    .brief .txt { flex: 1; font-size: 13.5px; color: var(--ink-muted); }
    .brief .txt b { color: var(--ink); font-weight: 600; }
    .brief .refine { white-space: nowrap; font-size: 13px; font-weight: 600; color: #C2552B; }
    .brief .refine:hover { text-decoration: underline; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }

    /* frosted match card — text UP, photo DOWN (per the reference) */
    .listing { display: flex; flex-direction: column; overflow: hidden; cursor: pointer;
      transition: opacity var(--m-expanded) var(--m-ease), transform var(--m-expanded) var(--m-ease), box-shadow .25s, border-color .25s; }
    .listing:hover { transform: translateY(-4px); box-shadow: 0 26px 56px rgba(122,62,22,0.16), inset 0 1px 0 rgba(255,255,255,0.9); border-color: rgba(255,123,44,0.4); }
    .listing .body { padding: 18px 18px 14px; }
    .listing .tags { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
    .listing .match { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: #C2552B; background: rgba(194,85,43,0.1); border: 1px solid rgba(194,85,43,0.22); padding: 3px 9px; border-radius: 100px; }
    .listing .price { font-family: var(--f-serif); font-size: 27px; color: var(--brand); }
    .listing .ttl { font-size: 14.5px; font-weight: 500; margin-top: 2px; }
    .listing .loc { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
    .listing .why { font-size: 12.5px; line-height: 1.55; color: var(--ink-muted); margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.7); }
    .listing .why b { color: #b0521f; font-weight: 600; }
    .listing .score { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 12px; color: var(--ink-muted); }
    .listing .ring { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--success); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--ink); }
    .listing .img { position: relative; height: 170px; margin: 0 10px 10px; border-radius: 15px; overflow: hidden; }
    .listing .img img { width: 100%; height: 100%; object-fit: cover; }
    .listing .save { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .empty { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 60px 0; color: var(--ink-muted); font-size: 14px; }
    .grid:empty + .empty { display: flex; }
  </style>
</head>
<body>
  <div class="bg-scene"></div>
  <div class="bg-wash"></div>
  <div class="appbar">
    <a class="brand" href="../index.html">
      <svg viewBox="0 0 64 78" fill="#15171a"><rect x="0" y="0" width="10" height="78" rx="1"/><rect x="10" y="0" width="44" height="10" rx="1"/><rect x="44" y="10" width="10" height="17" rx="1"/><rect x="10" y="17" width="44" height="10" rx="1"/><rect x="10" y="36" width="44" height="10" rx="1"/><rect x="46" y="46" width="8" height="22" rx="1"/><rect x="18" y="46" width="8" height="22" rx="1"/><rect x="10" y="68" width="44" height="10" rx="1"/></svg>
      Synapse
    </a>
    <nav>
      <a href="toju.html">Toju</a>
      <a href="browse.html" class="active">Your matches</a>
    </nav>
    <span class="spacer"></span>
    <a class="home" href="../index.html">← Back to site</a>
  </div>

  <div class="wrap">
    <div class="eyebrow">Picked for you</div>
    <div class="h1">Your matches</div>

    <div class="card brief">
      <div class="orb">✦</div>
      <div class="txt"><b>Your brief:</b> 3-bed for a family in Lagos, under ₦150M, near good schools. Toju found 5 verified homes that fit.</div>
      <a class="refine" href="toju.html">Refine with Toju →</a>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty">
      <span data-lottie="empty-search" style="width:150px;height:120px"></span>
      Nothing fits this brief yet — tell Toju what to change.
    </div>
  </div>

  <script>
    // Only the homes Toju matched to this brief — not the whole inventory.
    // Loads the REAL matched set for this visitor's session; the demo cards
    // below are the fallback before anyone has talked to Toju.
    const SUPABASE_URL = 'https://bhrhejpekmhbhwryjhgk.supabase.co';
    const ANON_KEY = 'sb_publishable_D25gO3eui5oI4L3h7bx-vg_fCHbo3LV';
    const VISITOR = localStorage.getItem('toju_visitor_v1');
    const naira = (n) => { n = Number(n) || 0; return n >= 1e9 ? '₦' + (n/1e9).toFixed(1) + 'B' : n >= 1e6 ? '₦' + Math.round(n/1e6) + 'M' : '₦' + n.toLocaleString(); };
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const demoMatches = [
      { img: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500&q=70', price: '₦148M', ttl: '3-Bed Terrace, Ikate', loc: 'Ikate, Lekki', score: 91, match: 94, why: '<b>Why:</b> ₦2M under budget, 12 min from your preferred school run, high-growth corridor.' },
      { img: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=500&q=70', price: '₦165M', ttl: '3-Bed Apartment, Lekki Phase 1', loc: 'Lekki Phase 1, Lagos', score: 94, match: 87, why: '<b>Why:</b> slightly over budget, but ₦12M below area median with an 8.4% yield.' },
      { img: 'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=500&q=70', price: '₦142M', ttl: '2-Bed Flat + Study, Victoria Island', loc: 'Victoria Island, Lagos', score: 89, match: 82, why: '<b>Why:</b> shortest commute of the five; the study converts to a third bedroom.' },
      { img: 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=500&q=70', price: '₦150M', ttl: '3-Bed Duplex, Osapa London', loc: 'Osapa, Lekki', score: 88, match: 80, why: '<b>Why:</b> right at budget with the most space per naira in this set.' },
      { img: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=500&q=70', price: '₦139M', ttl: '3-Bed Terrace, Sangotedo', loc: 'Sangotedo, Ajah', score: 84, match: 76, why: '<b>Why:</b> best price of the five — budget for the longer commute and flood check.' },
    ];
    const IMG_POOL = demoMatches.map((d) => d.img);
    function renderCards(list) {
      document.getElementById('grid').innerHTML = list.map((l, i) => `
        <a class="card listing" href="property.html">
          <div class="body">
            <div class="tags">
              <span class="chip chip-pass">✓ Verified</span>
              <span class="match">${l.match}% match</span>
            </div>
            <div class="price">${l.price}</div>
            <div class="ttl">${esc(l.ttl)}</div>
            <div class="loc">${esc(l.loc)}</div>
            <div class="why">${l.why}</div>
            <div class="score"><span class="ring">${l.score}</span> Trust score</div>
          </div>
          <div class="img">
            <img src="${l.img || IMG_POOL[i % IMG_POOL.length]}" alt="" />
            <div class="save">♡</div>
          </div>
        </a>
      `).join('');
      if (window.synMotion) synMotion.refresh();
    }
    renderCards(demoMatches);

    // real matches from this visitor's Toju session
    if (VISITOR) {
      fetch(SUPABASE_URL + '/functions/v1/toju-demo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
        body: JSON.stringify({ action: 'matches', visitorId: VISITOR }),
      }).then((r) => r.json()).then((d) => {
        if (!Array.isArray(d.matches) || d.matches.length === 0) return;
        renderCards(d.matches.map((m) => ({
          img: null,
          price: naira(m.price),
          ttl: m.title,
          loc: (m.neighbourhood && m.neighbourhood.name) ? m.neighbourhood.name : m.city,
          score: m.trustScore,
          match: m.fitScore || 80,
          why: m.why ? '<b>Why:</b> ' + esc(m.why)
             : (m.whatToWatch && m.whatToWatch !== 'No major synthetic flags' ? '<b>Watch:</b> ' + esc(m.whatToWatch) : esc(m.summary || '')),
        })));
        if (d.criteria && d.criteria.brief) {
          document.querySelector('.brief .txt').innerHTML =
            '<b>Your brief:</b> ' + esc(d.criteria.brief) + ' Toju found ' + d.matches.length + ' verified home' + (d.matches.length > 1 ? 's' : '') + ' that fit.';
        }
      }).catch(() => {});
    }
  </script>
  <script src="motion.js"></script>
</body>
</html>
