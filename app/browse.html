<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse — Synapse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <style>
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 24px; }
    .filters .f { font-size: 12.5px; font-weight: 500; color: var(--ink-muted); padding: 8px 15px; border-radius: 100px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; }
    .filters .f.on { color: var(--brand); background: rgba(255,123,44,0.08); border-color: rgba(255,123,44,0.22); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .listing { overflow: hidden; cursor: pointer; transition: all .25s; }
    .listing:hover { transform: translateY(-4px); box-shadow: 0 26px 56px rgba(20,26,38,0.12); }
    .listing .img { position: relative; height: 180px; }
    .listing .img img { width: 100%; height: 100%; object-fit: cover; }
    .listing .verified { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,0.92); }
    .listing .save { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .listing .body { padding: 16px; }
    .listing .price { font-family: var(--f-serif); font-size: 26px; color: var(--brand); }
    .listing .ttl { font-size: 14px; font-weight: 500; margin-top: 2px; }
    .listing .loc { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
    .listing .score { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 12px; color: var(--ink-muted); }
    .listing .ring { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--success); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="appbar">
    <a class="brand" href="../index.html">
      <svg viewBox="0 0 64 78" fill="#15171a"><rect x="0" y="0" width="10" height="78" rx="1"/><rect x="10" y="0" width="44" height="10" rx="1"/><rect x="44" y="10" width="10" height="17" rx="1"/><rect x="10" y="17" width="44" height="10" rx="1"/><rect x="10" y="36" width="44" height="10" rx="1"/><rect x="46" y="46" width="8" height="22" rx="1"/><rect x="18" y="46" width="8" height="22" rx="1"/><rect x="10" y="68" width="44" height="10" rx="1"/></svg>
      Synapse
    </a>
    <nav>
      <a href="toju.html">Toju</a>
      <a href="browse.html" class="active">Browse</a>
      <a href="agency.html">For Agencies</a>
    </nav>
    <span class="spacer"></span>
    <a class="home" href="../index.html">← Back to site</a>
  </div>

  <div class="wrap">
    <div class="eyebrow">Property Discovery</div>
    <div class="h1">Browse</div>
    <p class="muted" style="margin-top:4px;font-size:14px">4 verified listings · ordered by trust</p>

    <div class="filters">
      <div class="f on">All Lagos</div>
      <div class="f">Lekki</div>
      <div class="f">Victoria Island</div>
      <div class="f">Ikoyi</div>
      <div class="f" style="opacity:.6">Sale</div>
      <div class="f" style="opacity:.6">Rent</div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    const listings = [
      { img: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=500&q=70', price: '₦176M', ttl: '3-Bed Penthouse, Ikoyi', loc: 'Old Ikoyi, Lagos', score: 97 },
      { img: 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=500&q=70', price: '₦178M', ttl: '4-Bed Duplex, Osapa London', loc: 'Osapa, Lekki', score: 96 },
      { img: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=500&q=70', price: '₦165M', ttl: '3-Bed Apartment, Lekki Phase 1', loc: 'Lekki Phase 1, Lagos', score: 94 },
      { img: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500&q=70', price: '₦148M', ttl: '3-Bed Terrace, Ikate', loc: 'Ikate, Lekki', score: 91 },
      { img: 'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=500&q=70', price: '₦142M', ttl: '2-Bed Flat, Victoria Island', loc: 'Victoria Island, Lagos', score: 89 },
    ];
    document.getElementById('grid').innerHTML = listings.map(l => `
      <a class="card listing" href="property.html">
        <div class="img">
          <img src="${l.img}" alt="" />
          <span class="chip chip-pass verified">✓ Verified</span>
          <div class="save">♡</div>
        </div>
        <div class="body">
          <div class="price">${l.price}</div>
          <div class="ttl">${l.ttl}</div>
          <div class="loc">${l.loc}</div>
          <div class="score"><span class="ring">${l.score}</span> Trust score</div>
        </div>
      </a>
    `).join('');
  </script>
</body>
</html>
