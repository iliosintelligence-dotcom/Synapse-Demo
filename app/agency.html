<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agency Dashboard — Synapse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <style>
    .layout { display: grid; grid-template-columns: 200px 1fr; gap: 28px; }
    .side { display: flex; flex-direction: column; gap: 4px; }
    .side a { font-size: 13.5px; color: var(--ink-muted); padding: 10px 14px; border-radius: 12px; display: flex; align-items: center; gap: 9px; }
    .side a.on { background: rgba(255,123,44,0.08); color: var(--brand); font-weight: 600; }
    .side a:hover { background: rgba(0,0,0,0.03); }
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin: 22px 0; }
    .stat { padding: 16px; text-align: center; }
    .stat .v { font-family: var(--f-serif); font-size: 26px; color: var(--brand); }
    .stat .l { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }
    .lead { display: flex; align-items: center; gap: 18px; padding: 16px 18px; margin-bottom: 12px; }
    .lead .av { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,123,44,0.1); border: 1px solid rgba(255,123,44,0.25); display: flex; align-items: center; justify-content: center; color: var(--brand); font-weight: 600; font-size: 14px; }
    .lead .nm { font-weight: 600; font-size: 14px; }
    .lead .pr { font-size: 12px; color: var(--ink-muted); margin-top: 1px; }
    .lead .ph { font-size: 12px; color: var(--ink-dim); margin-top: 1px; }
    .src { font-size: 10.5px; padding: 2px 9px; border-radius: 100px; border: 1px solid; }
    .src.toju { color: var(--brand); border-color: rgba(255,123,44,0.3); background: rgba(255,123,44,0.07); }
    .src.contact { color: var(--success); border-color: rgba(46,125,79,0.25); background: rgba(46,125,79,0.08); }
    .src.browse { color: var(--ink-muted); border-color: var(--border); }
    .failed { font-size: 10.5px; padding: 2px 9px; border-radius: 100px; color: var(--gold); border: 1px solid rgba(156,122,30,0.4); background: rgba(156,122,30,0.1); }
    .wa { background: var(--brand); color: #fff; font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 100px; }
    .time { font-size: 12px; color: var(--ink-dim); }
    @media (max-width: 720px){ .layout{ grid-template-columns: 1fr; } .side{ flex-direction: row; flex-wrap: wrap; } .stats{ grid-template-columns: repeat(2,1fr);} }
  </style>
</head>
<body>
  <div class="appbar">
    <a class="brand" href="../index.html">
      <svg viewBox="0 0 64 78" fill="#15171a"><rect x="0" y="0" width="10" height="78" rx="1"/><rect x="10" y="0" width="44" height="10" rx="1"/><rect x="44" y="10" width="10" height="17" rx="1"/><rect x="10" y="17" width="44" height="10" rx="1"/><rect x="10" y="36" width="44" height="10" rx="1"/><rect x="46" y="46" width="8" height="22" rx="1"/><rect x="18" y="46" width="8" height="22" rx="1"/><rect x="10" y="68" width="44" height="10" rx="1"/></svg>
      Synapse
    </a>
    <nav>
      <a href="toju.html">Toju</a>
      <a href="browse.html">Browse</a>
      <a href="agency.html" class="active">For Agencies</a>
    </nav>
    <span class="spacer"></span>
    <a class="home" href="../index.html">← Back to site</a>
  </div>

  <div class="wrap">
    <div class="layout">
      <aside class="side">
        <a class="on" href="#">≣ Leads</a>
        <a href="#">⌂ Listings</a>
        <a href="#">⚙ Settings</a>
      </aside>

      <main>
        <div class="eyebrow">Prestige Realty Ltd. · Gold Verified</div>
        <div class="h1">Leads</div>
        <p class="muted" style="font-size:14px;margin-top:4px">Every inquiry that touches Synapse — newest first, in real time.</p>

        <div class="stats">
          <div class="card stat"><div class="v">47</div><div class="l">Listings</div></div>
          <div class="card stat"><div class="v">128</div><div class="l">Leads</div></div>
          <div class="card stat"><div class="v">94.2</div><div class="l">Trust score</div></div>
          <div class="card stat"><div class="v">₦2.4B</div><div class="l">Sales</div></div>
        </div>

        <div id="leads"></div>
      </main>
    </div>
  </div>

  <script>
    const leads = [
      { nm: 'Bola Adeyemi', ph: '+234 803 555 0142', pr: '3-Bed Apartment, Lekki Phase 1 · budget ₦150–180M', src: 'toju', t: '2m ago' },
      { nm: 'Chidi Okafor', ph: '+234 701 555 0199', pr: '4-Bed Duplex, Osapa London · budget ₦170–200M', src: 'contact', t: '24m ago' },
      { nm: 'Amina Yusuf', ph: '+234 814 555 0177', pr: '3-Bed Terrace, Ikate · budget ₦140–170M', src: 'browse', t: '1h ago' },
      { nm: 'Tunde Bakare', ph: '+234 802 555 0118', pr: '2-Bed Flat, Victoria Island · budget ₦130–160M', src: 'toju', t: '5h ago', failed: true },
    ];
    const initials = n => n.split(' ').map(w=>w[0]).join('').slice(0,2);
    const wa = (ph,pr) => 'https://wa.me/' + ph.replace(/[^\d]/g,'') + '?text=' + encodeURIComponent('Hello, thank you for your interest in ' + pr.split(' · ')[0] + ' via Synapse.');
    document.getElementById('leads').innerHTML = leads.map(l => `
      <div class="card lead">
        <div class="av">${initials(l.nm)}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="nm">${l.nm}</span>
            <span class="src ${l.src}">${l.src === 'toju' ? 'Toju' : l.src === 'contact' ? 'Contact' : 'Browse'}</span>
            ${l.failed ? '<span class="failed">⚠ Delivery failed</span>' : ''}
          </div>
          <div class="pr">${l.pr}</div>
          <div class="ph">${l.ph}</div>
        </div>
        <span class="time">${l.t}</span>
        <a class="wa" href="${wa(l.ph,l.pr)}" target="_blank" rel="noreferrer">WhatsApp</a>
      </div>
    `).join('');
  </script>
</body>
</html>
