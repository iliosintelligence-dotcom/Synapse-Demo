<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Synapse</title>
  <!-- Shown inside the app only when www.synapsecore.dev cannot be reached. The product itself is the live site; this is the one
       screen that has to work with no connection, so it needs nothing from the network: no fonts, no scripts from elsewhere. -->
  <style>
    :root { --bg: #FAF6F0; --ink: #15120F; --muted: #6B625A; --btn: #15120F; --btn-ink: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000000; --ink: #F4F1EA; --muted: #A7A09A; --btn: #FFFFFF; --btn-ink: #000000; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 32px 28px calc(32px + env(safe-area-inset-bottom, 0px)); text-align: center; }
    img { width: 44px; height: auto; }
    @media (prefers-color-scheme: dark) { img { filter: invert(1); } }
    h1 { margin: 6px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 0; max-width: 28ch; color: var(--muted); }
    button { margin-top: 10px; min-height: 52px; padding: 0 32px; border: 0; border-radius: 999px; background: var(--btn); color: var(--btn-ink); font: 600 17px system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="mark.svg" alt="">
    <h1>You are offline</h1>
    <p>Synapse needs a connection to find homes and talk to Tayo. Check your data or Wi-Fi, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.replace('https://www.synapsecore.dev/app/toju'); });
    window.addEventListener('online', function () { location.replace('https://www.synapsecore.dev/app/toju'); });
  </script>
</body>
</html>
