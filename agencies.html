<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synapse for agencies</title>

  <!-- The agency page is the homepage now. This file stays because seventeen
       links across the app pointed here, and anything already shared or indexed
       will keep pointing here too.

       Belt and braces on purpose: vercel.json issues a real 301, which is what
       search engines should follow, but that config does nothing under the
       local `npx serve`. The meta refresh works everywhere, and the canonical
       tells a crawler which URL is authoritative even if it never follows the
       redirect. The visible link is for anyone whose browser does neither. -->
  <link rel="canonical" href="/" />
  <meta http-equiv="refresh" content="0; url=/" />
  <meta name="robots" content="noindex" />

  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f5f5f5; color: #1a1a1a;
      font: 400 16px/1.6 "Josefin Sans", ui-sans-serif, system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    a { color: inherit; }
  </style>
</head>
<body>
  <p>Synapse for agencies has moved to the front page.<br />
     <a href="/">Continue to synapsecore.dev</a></p>
  <script>location.replace('/');</script>
</body>
</html>
